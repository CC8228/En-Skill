<title>理财问答室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap">
<style>
  /* Layout: phone = one column (我的情况 / 历史对话 folded above the conversation, composer pinned at the bottom);
     >= 900px = a 300px ledger column beside the conversation. Ledger-paper greens; red is kept for risk notes. */
  :root {
    --bg: #edf1ee;
    --surface: #fbfcfb;
    --sunken: #e3e9e5;
    --ink: #15211c;
    --muted: #566861;
    --line: #d2dbd5;
    --accent: #0e5a48;
    --accent-ink: #ffffff;
    --accent-soft: #d8e8e1;
    --risk: #ad271e;
    --risk-soft: #f6e1de;
    --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
    --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1512; --surface: #151e1a; --sunken: #1c2722; --ink: #e3ebe6; --muted: #93a59c; --line: #28352f;
      --accent: #5cc2a3; --accent-ink: #07130e; --accent-soft: #163128; --risk: #f08a7f; --risk-soft: #3a1c19;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1512; --surface: #151e1a; --sunken: #1c2722; --ink: #e3ebe6; --muted: #93a59c; --line: #28352f;
    --accent: #5cc2a3; --accent-ink: #07130e; --accent-soft: #163128; --risk: #f08a7f; --risk-soft: #3a1c19;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font-body); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 1160px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 0;
  }
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
  .top > div { display: grid; gap: 4px; min-width: 0; max-width: 62ch; }
  h1 { margin: 0; font: 700 26px/1.25 var(--font-display); letter-spacing: 0.02em; text-wrap: balance; }
  .top p { margin: 0; color: var(--muted); font-size: 14px; }

  .layout { display: grid; gap: 14px; }
  .side { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .main { min-width: 0; display: grid; gap: 0; align-content: start; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
    .side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 32px); overflow: auto; padding-bottom: 16px; }
  }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px/1 var(--font-body); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.small { padding: 6px 10px; font-size: 13px; font-weight: 500; }
  .btn.quiet { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; font-size: 13px; font-weight: 500; }
  .btn.quiet:hover { color: var(--ink); border-color: var(--line); }
  .btn.danger { color: var(--risk); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* side panels */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .panel > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; cursor: pointer; font-weight: 700; }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::after { content: "展开"; font: 500 12px/1 var(--font-body); color: var(--muted); }
  .panel[open] > summary::after { content: "收起"; }
  .panel > summary .count { margin-left: auto; font: 500 12px/1 var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
  .ledger { border-top: 1px solid var(--line); }
  .ledger .row { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 14px; border-bottom: 1px dashed var(--line); }
  .ledger label { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .ledger input, .ledger select, .ledger textarea { width: 100%; min-width: 0; font-size: 14px; line-height: 1.4; background: var(--sunken); border: 1px solid transparent; border-radius: 4px; padding: 6px 8px; }
  .ledger textarea { resize: vertical; }
  .ledger input::placeholder, .ledger textarea::placeholder { color: var(--muted); opacity: 0.75; }
  .ledger input:focus, .ledger select:focus, .ledger textarea:focus { border-color: var(--accent); outline: none; }
  .fine { margin: 0; padding: 10px 14px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .hist { list-style: none; margin: 0; padding: 4px 6px 6px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
  .hist button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 8px 8px; cursor: pointer; display: grid; gap: 2px; }
  .hist button:hover { background: var(--sunken); }
  .hist button[aria-current="true"] { background: var(--accent-soft); }
  .hist .t { font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hist .m { font: 500 11.5px/1.3 var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
  .hist .none { padding: 8px; font-size: 13px; color: var(--muted); }
  .status { font-size: 12px; color: var(--muted); padding-inline: 2px; }

  /* conversation */
  .convo { display: grid; gap: 18px; padding-bottom: 18px; }
  .thread-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .thread-head h2 { margin: 0; font: 700 19px/1.4 var(--font-display); text-wrap: balance; min-width: 0; }
  .thread-head .meta { font: 500 12px/1.4 var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
  .thread-head .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .turn { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
  .mark { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; font: 700 14px/1 var(--font-display); }
  .turn.q .mark { background: var(--accent-soft); color: var(--accent); }
  .turn.a .mark { background: var(--accent); color: var(--accent-ink); }
  .q-text { white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 500; padding-top: 2px; }
  .a-body { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 10px; min-width: 0; display: grid; gap: 8px; }
  .a-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-inline: -8px; }
  .a-foot .flag { font-size: 12.5px; color: var(--muted); padding-inline: 8px; }
  .thinking { color: var(--muted); margin: 0; }
  .thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; content: "…"; } }
  .err { margin: 0; color: var(--risk); background: var(--risk-soft); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  .partial { opacity: 0.75; }

  /* rendered answers */
  .md { min-width: 0; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h4 { margin: 14px 0 4px; font-size: 15px; font-weight: 700; }
  .md h4.risk { color: var(--risk); }
  .md p { margin: 4px 0 8px; }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 1.4em; }
  .md li { margin: 2px 0; }
  .md strong { font-weight: 700; }
  .md code { font: 500 0.9em/1 var(--font-num); background: var(--sunken); border-radius: 3px; padding: 1px 4px; }
  .md blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .tbl { overflow-x: auto; margin: 6px 0 10px; }
  .md table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 100%; }
  .md th, .md td { text-align: left; vertical-align: top; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .md th { font-weight: 700; background: var(--sunken); white-space: nowrap; }
  .calcs { border-top: 1px dashed var(--line); padding-top: 6px; font-size: 13px; color: var(--muted); }
  .calcs summary { cursor: pointer; }
  .calcs ol { margin: 6px 0 2px; padding-left: 1.6em; display: grid; gap: 3px; }
  .calcs li { font: 500 12.5px/1.5 var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; color: var(--ink); }

  /* empty state */
  .empty { display: grid; gap: 14px; padding-bottom: 8px; }
  .empty h2 { margin: 0; font: 700 19px/1.4 var(--font-display); }
  .empty > p { margin: 0; color: var(--muted); max-width: 64ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 14px; line-height: 1.4; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; text-align: left; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .example { display: grid; gap: 12px; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; }
  .example .tag { justify-self: start; font: 500 12px/1 var(--font-body); letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; }

  /* fallback */
  .copybox { width: 100%; min-height: 140px; font: 13px/1.5 var(--font-num); background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .confirm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink); }

  /* composer */
  .composer { position: sticky; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line); padding-block: 10px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
  .composer textarea { width: 100%; min-height: 72px; max-height: 40vh; resize: vertical; font-size: 15px; line-height: 1.55; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .composer textarea:focus { border-color: var(--accent); outline: none; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .bar .left { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg label { position: relative; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; padding: 6px 11px; font-size: 13px; color: var(--muted); }
  .seg label + label span { border-left: 1px solid var(--line); }
  .seg input:checked + span { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .note { margin: 0; font-size: 13px; color: var(--risk); }
  .disclaimer { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    .composer textarea { min-height: 52px; }
    #tier-hint { display: none; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>理财问答室</h1>
      <p>把自己的情况记一次，之后直接问。回答按中国大陆的产品和政策来讲，涉及金额会写出算式。</p>
    </div>
    <button class="btn" id="new-thread" type="button">新对话</button>
  </header>

  <div class="layout">
    <aside class="side">
      <details class="panel" id="prof-box">
        <summary>我的情况 <span class="count" id="prof-count">未填写</span></summary>
        <div class="ledger" id="ledger"></div>
        <p class="fine">都可以不填，填了回答会更贴近你。每次提问时会一起发给 Claude，你在对话里说的情况优先。</p>
      </details>
      <details class="panel" id="hist-box">
        <summary>历史对话 <span class="count" id="hist-count">0</span></summary>
        <ul class="hist" id="hist"></ul>
      </details>
      <div class="status" id="sync">对话暂存在本浏览器</div>
    </aside>

    <main class="main">
      <section class="convo" id="convo" aria-label="对话"></section>
      <p class="disclaimer">回答由 Claude 生成，供学习和参考，不构成投资建议。利率、税收和政策以银行和官方最新公布为准。</p>

      <form class="composer" id="composer">
        <label for="q" class="hint" hidden>你的问题</label>
        <textarea id="q" rows="3" placeholder="例如：每月到手 1.2 万，想 3 年攒 30 万首付，该怎么存？"></textarea>
        <div class="bar">
          <div class="left">
            <div class="seg" role="radiogroup" aria-label="回答方式">
              <label><input type="radio" name="tier" value="quick" id="tier-quick"><span>快速</span></label>
              <label><input type="radio" name="tier" value="default" id="tier-default"><span>标准</span></label>
              <label><input type="radio" name="tier" value="complex" id="tier-complex"><span>深入</span></label>
            </div>
            <span class="hint" id="tier-hint"></span>
          </div>
          <div class="row-btns">
            <span class="hint" id="key-hint"></span>
            <button class="btn" id="stop" type="button" hidden>停止</button>
            <button class="btn primary" id="send" type="submit">发送</button>
          </div>
        </div>
        <p class="note" id="note" hidden></p>
      </form>
    </main>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const clone = (v) => JSON.parse(JSON.stringify(v));
const fmt = (n) => Number(n).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
const round2 = (x) => Math.round(x * 100) / 100;
const pad = (n) => String(n).padStart(2, "0");
function dateStr(ms) { const d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
const wide = () => window.matchMedia("(min-width: 900px)").matches;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- profile fields (the ledger) ----
const FIELDS = [
  { k: "region", label: "所在地区", ph: "例如：中国大陆 · 杭州" },
  { k: "age", label: "年龄", opts: ["", "25 岁以下", "26–30 岁", "31–35 岁", "36–40 岁", "41–50 岁", "51–60 岁", "60 岁以上"] },
  { k: "family", label: "家庭", opts: ["", "单身", "已婚，没有孩子", "已婚，有孩子", "单亲，有孩子", "需要赡养父母"] },
  { k: "income", label: "税后月收入", ph: "例如：12000 元，年终奖 2 个月" },
  { k: "spend", label: "每月支出", ph: "例如：房租 3500，生活费 3000" },
  { k: "assets", label: "存款和投资", ph: "例如：活期 3 万，基金 5 万" },
  { k: "debt", label: "负债", ph: "例如：房贷 80 万，剩 25 年，利率 3.3%" },
  { k: "insurance", label: "已有保险", ph: "例如：社保 + 公司团险" },
  { k: "risk", label: "风险偏好", opts: ["", "保守：不能接受本金亏损", "稳健：能接受小幅波动", "平衡：能接受一年内亏 10% 左右", "积极：能接受亏 20% 以上的波动"] },
  { k: "goal", label: "理财目标", ph: "例如：3 年攒首付，给孩子存教育金" },
  { k: "other", label: "其他", ph: "公积金、个税专项附加扣除、打算换工作等", area: true },
];

const STARTERS = [
  "每个月工资该怎么分配？",
  "应急金该存多少，放在哪里？",
  "货币基金、银行理财、国债和定期存款有什么区别？",
  "想开始定投指数基金，要注意什么？",
  "个人养老金账户值得开吗？",
  "手上有闲钱，提前还房贷划算吗？",
  "刚工作，应该先买哪些保险？",
  "信用卡分期的真实年化利率怎么算？",
];

const EXAMPLE_Q = "每月到手 12000 元，房租 3500，没有存款，该从哪里开始？";
const EXAMPLE_A = [
  "### 结论",
  "先存应急金，再考虑投资。建议每月先存下到手收入的 25%，也就是 **3000 元**。",
  "### 具体怎么做",
  "- 发工资当天先把 3000 元转到单独的账户，剩下的才是生活费",
  "- 按每月支出约 9000 元算，3–6 个月的应急金是 2.7–5.4 万元，每月存 3000 元大约要 9–18 个月",
  "- 应急金放在随时能取、几乎不会亏的地方：活期、货币基金或短期定期存款",
  "- 应急金存够之后，再按自己的风险偏好拿一部分做长期投资",
  "### 风险和注意",
  "没有应急金就去投资，遇到失业或急用钱时，可能要在亏损的时候被迫卖出。",
].join("\n");

// ---- local storage (a mirror; the account copy lives in db) ----
const LS = { threads: "fin-threads", profile: "fin-profile", prefs: "fin-prefs", draft: "fin-draft" };
function readLocal(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch { return d; } }
function writeLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

let threads = readLocal(LS.threads, {});
if (!threads || typeof threads !== "object" || Array.isArray(threads)) threads = {};
let prof = readLocal(LS.profile, null);
if (!prof || typeof prof.fields !== "object" || !prof.fields) prof = { fields: {}, updatedAt: 0 };
const prefs = Object.assign({ tier: "default" }, readLocal(LS.prefs, {}));
if (!["quick", "default", "complex"].includes(prefs.tier)) prefs.tier = "default";

let activeId = null;
let live = null;        // { id, text, calcs, ctl, done } while Claude is answering
let failure = null;     // { id, msg, partial }
let fallbackId = null;  // thread showing the copy-to-chat fallback
const deleted = new Set();

function saveLocalThreads() {
  const keep = Object.values(threads).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 60);
  writeLocal(LS.threads, Object.fromEntries(keep.map((t) => [t.id, t])));
}
function newId() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function titleFrom(text) { const s = text.replace(/\s+/g, " ").trim(); return s.length > 28 ? s.slice(0, 28) + "…" : s; }
function showNote(msg) { $("note").textContent = msg || ""; $("note").hidden = !msg; }

// ---- account storage ----
let remoteBase = null, remoteColl = null;
const chains = {};
function chain(key, fn) {
  const p = (chains[key] || Promise.resolve()).then(fn);
  chains[key] = p.catch(() => {});
  return p;
}
function setSync(ok, msg) {
  $("sync").textContent = ok ? "对话和情况保存在你的账号里，只有你自己能看到" : (msg || "暂时没能保存到账号，已先存在本浏览器");
}
function persistThread(t) {
  threads[t.id] = t;
  saveLocalThreads();
  if (!remoteColl) return;
  const id = t.id, body = clone(t);
  delete body._synced;
  chain(id, () => remoteColl.doc(id).set(body)).then(
    () => { if (threads[id]) threads[id]._synced = true; setSync(true); },
    (e) => setSync(false, e && e.code === "invalid_argument" ? "这个对话太长，没能保存到账号。点“新对话”继续提问。" : null),
  );
}
function removeThread(id) {
  deleted.add(id);
  delete threads[id];
  saveLocalThreads();
  if (remoteColl) chain(id, () => remoteColl.doc(id).delete()).catch(() => setSync(false));
}
let profTimer = null;
function saveProfileRemote() {
  if (!remoteBase) return;
  clearTimeout(profTimer);
  profTimer = setTimeout(() => {
    const body = { profile: { ...prof.fields }, updatedAt: prof.updatedAt };
    chain("profile", () => remoteBase.set(body)).then(() => setSync(true), () => setSync(false));
  }, 700);
}

function mergeRemote(snap) {
  const before = activeId && threads[activeId] ? JSON.stringify(threads[activeId].turns) : null;
  const next = {};
  for (const d of snap.docs) {
    if (deleted.has(d.id)) continue;
    const r = { ...clone(d.data()), id: d.id, _synced: true };
    if (!Array.isArray(r.turns)) r.turns = [];
    const l = threads[d.id];
    next[d.id] = l && (l.updatedAt || 0) > (r.updatedAt || 0) ? l : r;
  }
  for (const l of Object.values(threads)) {
    if (next[l.id]) continue;
    if (!l._synced || (live && live.id === l.id)) next[l.id] = l;   // not uploaded yet, or being answered
  }
  threads = next;
  saveLocalThreads();
  if (activeId && !threads[activeId]) activeId = null;
  renderHistory();
  const after = activeId && threads[activeId] ? JSON.stringify(threads[activeId].turns) : null;
  if (after !== before && !live) renderConvo();
}

async function initRemote() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const base = db.doc("data/users/" + uid + "/finance");
    const coll = base.collection("threads");
    const ps = await base.get();
    const rp = ps.exists ? ps.data() : null;
    const remoteAt = (rp && rp.updatedAt) || 0;
    if (rp && rp.profile && remoteAt >= (prof.updatedAt || 0)) {
      prof = { fields: { ...rp.profile }, updatedAt: remoteAt };
      writeLocal(LS.profile, prof);
      fillProfile();
    }
    remoteBase = base; remoteColl = coll;
    if ((prof.updatedAt || 0) > remoteAt) saveProfileRemote();
    for (const t of Object.values(threads)) if (!t._synced) persistThread(t);
    coll.orderBy("updatedAt", "desc").limit(100).onSnapshot(mergeRemote, () => setSync(false));
    setSync(true);
  } catch {
    remoteBase = null; remoteColl = null;
    setSync(false);
  }
}

// ---- calculators Claude can call, so amounts are computed rather than estimated ----
function evalExpr(src) {
  const s = String(src == null ? "" : src).replace(/[，,\s]/g, "").replace(/[×xX]/g, "*").replace(/÷/g, "/").replace(/（/g, "(").replace(/）/g, ")");
  let i = 0;
  const fail = (m) => { throw new Error(m + "（表达式：" + s + "）"); };
  function number() {
    const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
    if (!m) fail("第 " + (i + 1) + " 个字符这里应该是数字");
    i += m[0].length;
    let v = parseFloat(m[0]);
    if (s[i] === "%") { i++; v /= 100; }
    return v;
  }
  function power() {
    let base;
    if (s[i] === "(") {
      i++; base = sum();
      if (s[i] !== ")") fail("缺少右括号");
      i++;
      if (s[i] === "%") { i++; base /= 100; }
    } else base = number();
    if (s[i] === "^" || (s[i] === "*" && s[i + 1] === "*")) { i += s[i] === "^" ? 1 : 2; return Math.pow(base, unary()); }
    return base;
  }
  function unary() {
    if (s[i] === "-") { i++; return -unary(); }
    if (s[i] === "+") { i++; return unary(); }
    return power();
  }
  function product() {
    let v = unary();
    for (;;) {
      if (s[i] === "*" && s[i + 1] !== "*") { i++; v *= unary(); }
      else if (s[i] === "/") { i++; v /= unary(); }
      else return v;
    }
  }
  function sum() {
    let v = product();
    for (;;) {
      if (s[i] === "+") { i++; v += product(); }
      else if (s[i] === "-") { i++; v -= product(); }
      else return v;
    }
  }
  if (!s) fail("表达式是空的");
  const v = sum();
  if (i < s.length) fail("无法识别：" + s.slice(i, i + 12));
  if (!Number.isFinite(v)) fail("结果不是有限的数");
  return Number(v.toPrecision(12));
}

function termMonths(inp) { return Math.round(Number(inp.months) || Number(inp.years) * 12 || 0); }

function loanCalc(inp) {
  const P = Number(inp.principal), rate = Number(inp.annualRatePct), n = termMonths(inp);
  if (!(P > 0)) throw new Error("principal 是贷款本金，要大于 0，单位元");
  if (!(rate >= 0 && rate < 50)) throw new Error("annualRatePct 是年利率的百分数，例如 3.1 表示 3.1%");
  if (!(n >= 1 && n <= 600)) throw new Error("期限要在 1–600 个月之间，用 months 或 years 给出");
  const r = rate / 100 / 12;
  const byPrincipal = String(inp.method || "").includes("本金");
  const k = Math.max(0, Math.min(n, Math.round(Number(inp.paidMonths) || 0)));
  const out = { method: byPrincipal ? "等额本金" : "等额本息", principal: P, annualRatePct: rate, months: n };
  if (!byPrincipal) {
    const g = Math.pow(1 + r, n);
    const pay = r === 0 ? P / n : (P * r * g) / (g - 1);
    out.monthlyPayment = round2(pay);
    out.totalPayment = round2(pay * n);
    out.totalInterest = round2(pay * n - P);
    if (k) {
      const gk = Math.pow(1 + r, k);
      const rem = r === 0 ? P - pay * k : P * gk - (pay * (gk - 1)) / r;
      out.paidMonths = k;
      out.remainingPrincipal = round2(Math.max(0, rem));
      out.interestPaidSoFar = round2(pay * k - (P - rem));
    }
  } else {
    const base = P / n;
    const interest = (r * P * (n + 1)) / 2;
    out.firstMonthPayment = round2(base + P * r);
    out.lastMonthPayment = round2(base + base * r);
    out.monthlyDecrease = round2(base * r);
    out.totalInterest = round2(interest);
    out.totalPayment = round2(P + interest);
    if (k) {
      out.paidMonths = k;
      out.remainingPrincipal = round2(Math.max(0, P - base * k));
      out.interestPaidSoFar = round2(r * (k * P - (base * k * (k - 1)) / 2));
      out.nextMonthPayment = k < n ? round2(base + (P - base * k) * r) : 0;
    }
  }
  return out;
}

function investCalc(inp) {
  const init = Number(inp.initial) || 0, m = Number(inp.monthly) || 0, rate = Number(inp.annualRatePct), n = termMonths(inp);
  if (init < 0 || m < 0 || !(init + m > 0)) throw new Error("initial（一次性投入）和 monthly（每月投入）至少一个大于 0，单位元");
  if (!(rate > -50 && rate < 100)) throw new Error("annualRatePct 是假设的年化收益率百分数，例如 4 表示 4%");
  if (!(n >= 1 && n <= 1200)) throw new Error("期限要在 1–1200 个月之间，用 months 或 years 给出");
  const r = rate / 100 / 12, g = Math.pow(1 + r, n);
  const fv = init * g + (r === 0 ? m * n : (m * (g - 1)) / r);
  const contributed = init + m * n;
  const out = { months: n, futureValue: round2(fv), totalContributed: round2(contributed), gain: round2(fv - contributed), assumption: "年化收益率除以 12 按月复利，每月月末投入，未扣税费" };
  const inf = Number(inp.inflationPct);
  if (inp.inflationPct != null && Number.isFinite(inf)) {
    out.inflationPct = inf;
    out.inTodaysMoney = round2(fv / Math.pow(1 + inf / 100, n / 12));
  }
  return out;
}

const TOOL_SPECS = [
  {
    name: "calc",
    description: "精确计算一个算术表达式，返回 {result}。支持 + - * / ^（乘方）和括号；数字后面的 % 表示百分比（3% = 0.03）；可以带千分位逗号。例：(1+0.03/12)^120、500000*3.1%/12。",

    inputSchema: {
      type: "object",
      properties: {

        months: { type: "number", description: "期限（月）" },
        inflationPct: { type: "number", description: "可选：假设的年通胀率百分数" },
      },

    },

      + fmt(o.futureValue) + "（共投入 " + fmt(o.totalContributed) + "）" + (o.inTodaysMoney != null ? "，折合今天 " + fmt(o.inTodaysMoney) : ""),
  },
];

function makeTools(calcs, onUpdate) {
  return TOOL_SPECS.map((t) => ({
    name: t.name, description: t.description, inputSchema: t.inputSchema,
    execute(input) {
      const inp = input && typeof input === "object" ? input : {};
      const out = t.run(inp);
      calcs.push(t.show(inp, out));
      onUpdate();
      return out;
    },
  }));
}

// ---- what Claude reads ----
function profileText() {
  const filled = FIELDS.filter((f) => String(prof.fields[f.k] || "").trim());
  if (!filled.length) return "（用户还没有填写。需要时按一位普通上班族来假设，并在回答里写明假设。）";
  return filled.map((f) => "- " + f.label + "：" + String(prof.fields[f.k]).trim().slice(0, 300)).join("\n");
}
function rulesText(tools) {
  return [
    "你是一位耐心、专业、立场中立的个人理财顾问，帮用户理清和解决自己的理财问题。",

    "6. 不推荐具体股票、具体基金代码或具体保险产品，不预测短期涨跌；可以讲产品类别、挑选标准和比较方法。",
    "7. 信息不够判断时，先按合理假设给出初步答案，并在最后列出最多 3 个需要补充的信息。",

    "9. 买房、大额保险、借贷投资这类大额决策，提醒必要时咨询持牌专业人士，但不要每次都写长篇免责声明。",
    "",

    profileText(),
    "",

function buildInput(t, tools) {
  const recent = t.turns.slice(-16).map((x) => ({ role: x.role, content: x.content }));
  return [{ role: "user", content: rulesText(tools) }, ...recent];
}
function buildCopyText(t) {
  let talk = t.turns.map((x) => (x.role === "user" ? "我：" : "你：") + x.content).join("\n\n");
  if (talk.length > 8000) talk = "……" + talk.slice(-8000);
  return rulesText(false) + "\n\n" + talk;
}

// ---- asking Claude ----
let sample = null, toolsOk = false, sampleOff = false;
const sampleReady = (async () => {
  if (!window.claude || !window.claude.use) return;
  try { sample = await window.claude.use("sample"); } catch { sample = null; }
  if (sample) {
    try { const lim = await sample.limits(); toolsOk = !!(lim && lim.tools); } catch { toolsOk = false; }
  }
})();

const OFF = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
const ERRORS = {
  rate_limited: "请求太频繁，或者已经到了使用上限。等一会儿再点“重试”。",
  session_expired: "登录已过期。重新登录 claude.ai 后再点“重试”。",
  refused: "Claude 没有回答这个问题。换个问法再问一次。",
  empty_completion: "没有得到回答。换个问法，或者把问题拆小一点。",
  prompt_too_large: "这个对话太长了。点“新对话”，把关键情况重新说一遍再问。",
  tools_unavailable: "计算工具暂时不能用。点“重试”会改为不带工具回答。",
  upstream_error: "连接中断了。点“重试”再问一次。",
};

async function answer(id) {
  if (live || !threads[id]) return;
  failure = null; fallbackId = null; showNote("");
  const ctl = new AbortController();
  let settle;
  live = { id, text: "", calcs: [], ctl, done: new Promise((r) => { settle = r; }) };
  const calcs = live.calcs;
  setBusy(true); renderConvo();
  try {
    await sampleReady;
    if (!sample || sampleOff) { fallbackId = id; return; }
    const useTools = toolsOk;
    const opts = {
      modelTier: prefs.tier, cache: false, signal: ctl.signal,
      onText: ({ text }) => { if (live && live.ctl === ctl) { live.text = text; drawLive(); } },
    };
    if (useTools) opts.tools = makeTools(calcs, drawLive);
    const res = await sample(buildInput(threads[id], useTools), opts);
    finish(id, res.text, calcs, res.truncated ? "truncated" : null);
  } catch (e) {
    const code = (e && e.code) || "upstream_error";
    if (code === "cancelled") {
      if (e.text && e.text.trim()) finish(id, e.text, calcs, "stopped");
    } else if (OFF.includes(code)) {
      sampleOff = true; fallbackId = id;
    } else {
      if (code === "tools_unavailable") toolsOk = false;
      failure = { id, msg: ERRORS[code] || ERRORS.upstream_error, partial: code === "refused" ? "" : (e.text || "") };
    }
  } finally {
    live = null; settle();
    setBusy(false); renderConvo(); renderHistory();
  }
}

function finish(id, text, calcs, flag) {
  const t = threads[id];
  if (!t) return;
  const nt = clone(t);
  const turn = { role: "assistant", content: text, at: Date.now() };
  if (calcs.length) turn.calcs = calcs.slice();
  if (flag) turn.flag = flag;
  nt.turns.push(turn);
  nt.updatedAt = Date.now();
  persistThread(nt);
}

async function submit() {
  const text = $("q").value.trim();
  if (!text) { $("q").focus(); return; }
  if (live) {
    if (live.id === activeId) return;   // stop the current answer first
    live.ctl.abort(); await live.done;
  }
  const now = Date.now();
  let t = activeId && threads[activeId] ? clone(threads[activeId]) : null;
  if (!t) t = { id: newId(), title: titleFrom(text), turns: [], createdAt: now, updatedAt: now, _synced: false };
  t.turns.push({ role: "user", content: text, at: now });
  t.updatedAt = now;
  activeId = t.id;
  persistThread(t);
  $("q").value = ""; writeLocal(LS.draft, "");
  renderHistory(); renderConvo();
  scrollToLastQuestion();
  if (JSON.stringify(t).length > 200000) showNote("这个对话已经很长了，问完这个建议点“新对话”。");
  answer(t.id);
}

async function regenerate(id) {
  if (live) return;
  const t = threads[id];
  if (!t || !t.turns.length || t.turns[t.turns.length - 1].role !== "assistant") return;
  const nt = clone(t);
  nt.turns.pop();
  nt.updatedAt = Date.now();
  persistThread(nt);
  answer(id);
}

function setBusy(busy) {
  $("send").hidden = busy;
  $("stop").hidden = !busy;
}

// ---- Markdown to DOM (headings, lists, tables, bold, code) without innerHTML ----
function inline(parent, text) {
  for (const part of text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g)) {
    if (!part) continue;
    if (/^\*\*[^*]+\*\*$/.test(part)) parent.append(el("strong", null, part.slice(2, -2)));
    else if (/^`[^`]+`$/.test(part)) parent.append(el("code", null, part.slice(1, -1)));
    else parent.append(document.createTextNode(part));
  }
}
const TABLE_ROW = /^\s*\|.*\|\s*$/;
const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
function cells(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map((c) => c.trim());
}
function renderMarkdown(text, into) {
  const lines = text.split("\n");
  let list = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trimEnd();
    if (TABLE_ROW.test(line) && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
      list = null;
      const wrap = el("div", "tbl"), table = el("table"), thead = el("thead"), tbody = el("tbody");
      const hr = el("tr");
      for (const c of cells(line)) { const th = el("th"); inline(th, c); hr.append(th); }
      thead.append(hr);
      i += 2;
      while (i < lines.length && TABLE_ROW.test(lines[i])) {
        const tr = el("tr");
        for (const c of cells(lines[i])) { const td = el("td"); inline(td, c); tr.append(td); }
        tbody.append(tr);
        i++;
      }
      i--;
      table.append(thead, tbody); wrap.append(table); into.append(wrap);
      continue;
    }
    const h = line.match(/^#{1,6}\s+(.*)$/);
    const ul = line.match(/^\s*[-*•]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)、]\s*(.*)$/);
    const bq = line.match(/^\s*>\s?(.*)$/);
    if (h) {
      list = null;
      const e = el("h4", /风险|注意|提醒/.test(h[1]) ? "risk" : null);
      inline(e, h[1].replace(/\*\*/g, "")); into.append(e);
    } else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      list = null; into.append(el("hr"));
    } else if (ul || ol) {
      const tag = ul ? "UL" : "OL";
      if (!list || list.tagName !== tag) { list = el(tag.toLowerCase()); into.append(list); }
      const li = el("li"); inline(li, (ul || ol)[1]); list.append(li);
    } else if (bq) {
      list = null; const q = el("blockquote"); inline(q, bq[1]); into.append(q);
    } else if (line.trim()) {
      list = null; const p = el("p"); inline(p, line); into.append(p);
    } else list = null;
  }
}

// ---- rendering ----
function drawCalcs(box, calcs, open) {
  box.replaceChildren();
  box.hidden = !calcs || !calcs.length;
  if (box.hidden) return;
  const d = el("details"); d.open = !!open;
  d.append(el("summary", null, "计算记录（" + calcs.length + " 次）"));
  const ol = el("ol");
  for (const c of calcs) ol.append(el("li", null, c));
  d.append(ol); box.append(d);
}

function drawLive() {
  const body = $("live-body");
  if (!body || !live) return;
  body.replaceChildren();
  if (live.text) renderMarkdown(live.text, body);
  else body.append(el("p", "thinking", live.calcs.length ? "正在计算" : "Claude 正在思考"));
  drawCalcs($("live-calcs"), live.calcs, true);
}

function answerShell() {
  const row = el("div", "turn a");
  row.append(el("div", "mark", "答"));
  const body = el("div", "a-body");
  row.append(body);
  return [row, body];
}

function turnEl(t, turn, i) {
  if (turn.role === "user") {
    const row = el("div", "turn q");
    row.append(el("div", "mark", "问"), el("div", "q-text", turn.content));
    return row;
  }
  const [row, body] = answerShell();
  const md = el("div", "md"); renderMarkdown(turn.content, md);
  const calcs = el("div", "calcs"); drawCalcs(calcs, turn.calcs, false);
  const foot = el("div", "a-foot");
  const copy = el("button", "btn quiet", "复制回答"); copy.type = "button";
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(turn.content); copy.textContent = "已复制"; }
    catch { copy.textContent = "复制失败，请长按文字复制"; }
    setTimeout(() => { if (copy.isConnected) copy.textContent = "复制回答"; }, 2000);
  });
  foot.append(copy);
  if (i === t.turns.length - 1 && !live) {
    const again = el("button", "btn quiet", "重新回答"); again.type = "button";
    again.addEventListener("click", () => regenerate(t.id));
    foot.append(again);
  }
  if (turn.flag === "stopped") foot.append(el("span", "flag", "回答中途停止了"));
  if (turn.flag === "truncated") foot.append(el("span", "flag", "回答太长被截断了，可以接着问“继续”"));
  body.append(md, calcs, foot);
  return row;
}

function liveEl() {
  const [row, body] = answerShell();
  const md = el("div", "md"); md.id = "live-body";
  const calcs = el("div", "calcs"); calcs.id = "live-calcs"; calcs.hidden = true;
  body.append(md, calcs);
  return row;
}

function failureEl(t) {
  const [row, body] = answerShell();
  if (failure.partial) { const md = el("div", "md partial"); renderMarkdown(failure.partial, md); body.append(md); }
  body.append(el("p", "err", failure.msg));
  const retry = el("button", "btn small", "重试"); retry.type = "button";
  retry.addEventListener("click", () => answer(t.id));
  const btns = el("div", "row-btns"); btns.append(retry); body.append(btns);
  return row;
}

function pendingEl(t) {
  const [row, body] = answerShell();
  body.append(el("p", "thinking-none", "这个问题还没有回答。"));
  const go = el("button", "btn small", "回答这个问题"); go.type = "button";
  go.addEventListener("click", () => answer(t.id));
  const btns = el("div", "row-btns"); btns.append(go); body.append(btns);
  return row;
}

function fallbackEl(t) {
  const [row, body] = answerShell();
  body.append(el("p", null, "这里暂时不能直接调用 Claude，可能是没有允许，或者当前打开方式不支持。可以复制下面的内容，粘贴到 Claude 对话里问。"));
  const ta = el("textarea", "copybox"); ta.id = "copy-box"; ta.readOnly = true; ta.value = buildCopyText(t);
  const btns = el("div", "row-btns");
  const copy = el("button", "btn small", "复制"); copy.type = "button";
  const msg = el("span", "hint");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(ta.value); msg.textContent = "已复制，可以粘贴到 Claude 对话里。"; }
    catch { ta.focus(); ta.select(); msg.textContent = "已选中文字，请手动复制。"; }
  });
  btns.append(copy);
  if (window.claude && window.claude.use) {
    const perm = el("button", "btn small", "打开权限设置"); perm.type = "button";
    perm.addEventListener("click", async () => {
      try {
        const p = await window.claude.use("permissions");
        if (!p) throw new Error("unavailable");
        await p.manage();
        msg.textContent = "如果刚才允许了，点“回答这个问题”再试一次。";
        sampleOff = false;
        const again = el("button", "btn small", "回答这个问题"); again.type = "button";
        again.addEventListener("click", () => answer(t.id));
        if (!btns.querySelector(".again")) { again.classList.add("again"); btns.append(again); }
      } catch { msg.textContent = "请在页面右上角的菜单里找到权限设置，允许这个页面使用 Claude。"; }
    });
    btns.append(perm);
  }
  btns.append(msg);
  body.append(ta, btns);
  return row;
}

function threadHead(t) {
  const head = el("div", "thread-head");
  const left = el("div");
  left.style.minWidth = "0";
  left.append(el("h2", null, t.title));
  const asked = t.turns.filter((x) => x.role === "user").length;
  left.append(el("div", "meta", dateStr(t.createdAt || t.updatedAt) + " 开始 · " + asked + " 个问题"));
  const tools = el("div", "tools");
  const del = el("button", "btn quiet danger", "删除对话"); del.type = "button";
  del.addEventListener("click", () => {
    const box = el("span", "confirm");
    const yes = el("button", "btn small danger", "删除"); yes.type = "button";
    const no = el("button", "btn small", "取消"); no.type = "button";
    box.append("删除后找不回来，确定吗？", yes, no);
    tools.replaceChildren(box);
    no.addEventListener("click", () => tools.replaceChildren(del));
    yes.addEventListener("click", async () => {
      if (live && live.id === t.id) { live.ctl.abort(); await live.done; }
      removeThread(t.id);
      if (failure && failure.id === t.id) failure = null;
      activeId = null;
      renderHistory(); renderConvo();
    });
    yes.focus();
  });
  tools.append(del);
  head.append(left, tools);
  return head;
}

function emptyState() {
  const box = el("div", "empty");
  box.append(el("h2", null, "问一个理财问题"));
  box.append(el("p", null, "可以问概念（R2 风险等级是什么意思）、算账（提前还 10 万房贷能省多少利息）、做选择（应急金放哪里），也可以把自己的情况说清楚，让 Claude 帮你排先后。"));
  const chips = el("div", "chips");
  for (const s of STARTERS) {
    const c = el("button", "chip", s); c.type = "button";
    c.addEventListener("click", () => { const q = $("q"); q.value = s; writeLocal(LS.draft, s); q.focus(); q.setSelectionRange(s.length, s.length); });
    chips.append(c);
  }
  box.append(chips);
  const ex = el("article", "example");
  ex.append(el("span", "tag", "示例回答"));
  const q = el("div", "turn q"); q.append(el("div", "mark", "问"), el("div", "q-text", EXAMPLE_Q));
  const [a, body] = answerShell();
  const md = el("div", "md"); renderMarkdown(EXAMPLE_A, md); body.append(md);
  ex.append(q, a);
  box.append(ex);
  return box;
}

function renderConvo() {
  const box = $("convo");
  box.replaceChildren();
  const t = activeId ? threads[activeId] : null;
  if (!t) { box.append(emptyState()); return; }
  box.append(threadHead(t));
  t.turns.forEach((turn, i) => box.append(turnEl(t, turn, i)));
  const last = t.turns[t.turns.length - 1];
  if (live && live.id === t.id) { box.append(liveEl()); drawLive(); }
  else if (fallbackId === t.id) box.append(fallbackEl(t));
  else if (failure && failure.id === t.id) box.append(failureEl(t));
  else if (last && last.role === "user") box.append(pendingEl(t));
}

function renderHistory() {
  const list = $("hist");
  list.replaceChildren();
  const all = Object.values(threads).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  $("hist-count").textContent = all.length ? all.length + " 个" : "0";
  if (!all.length) { list.append(el("li", "none", "还没有对话。提问后会自动保存在这里。")); return; }
  for (const t of all) {
    const li = el("li");
    const b = el("button"); b.type = "button";
    if (t.id === activeId) b.setAttribute("aria-current", "true");
    const asked = (t.turns || []).filter((x) => x.role === "user").length;
    b.append(el("span", "t", t.title || "未命名"), el("span", "m", dateStr(t.updatedAt || t.createdAt).slice(5) + " · " + asked + " 问"));
    b.addEventListener("click", () => openThread(t.id));
    li.append(b); list.append(li);
  }
}

function openThread(id) {
  if (live && live.id !== id) live.ctl.abort();
  activeId = id;
  showNote("");
  renderHistory(); renderConvo();
  if (!wide()) $("hist-box").open = false;
  $("convo").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
}

function scrollToLastQuestion() {
  const qs = $("convo").querySelectorAll(".turn.q");
  const lastQ = qs[qs.length - 1];
  if (lastQ) lastQ.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
}

// ---- profile form ----
function profileCount() { return FIELDS.filter((f) => String(prof.fields[f.k] || "").trim()).length; }
function updateProfCount() { const n = profileCount(); $("prof-count").textContent = n ? "已填 " + n + " 项" : "未填写"; }
function onProfileInput(k, v) {
  prof.fields[k] = v;
  prof.updatedAt = Date.now();
  writeLocal(LS.profile, prof);
  saveProfileRemote();
  updateProfCount();
}
function buildProfile() {
  const box = $("ledger");
  for (const f of FIELDS) {
    const row = el("div", "row");
    const lab = el("label", null, f.label); lab.htmlFor = "pf-" + f.k;
    let input;
    if (f.opts) {
      input = el("select");
      for (const o of f.opts) { const op = el("option", null, o || "未填"); op.value = o; input.append(op); }
      input.addEventListener("change", () => onProfileInput(f.k, input.value));
    } else {
      input = el(f.area ? "textarea" : "input");
      if (f.area) input.rows = 2; else input.type = "text";
      input.placeholder = f.ph;
      input.addEventListener("input", () => onProfileInput(f.k, input.value));
    }
    input.id = "pf-" + f.k;
    row.append(lab, input);
    box.append(row);
  }
  fillProfile();
}
function fillProfile() {
  for (const f of FIELDS) {
    const input = $("pf-" + f.k);
    if (!input || input === document.activeElement) continue;
    const v = String(prof.fields[f.k] || "");
    if (f.opts && v && !f.opts.includes(v)) { const op = el("option", null, v); op.value = v; input.append(op); }
    input.value = v;
  }
  updateProfCount();
}

// ---- composer ----
const TIER_HINT = { quick: "几秒内开始回答，适合概念题", default: "先思考再回答，一般十几秒到一分钟", complex: "最仔细，适合复杂规划，可能要一两分钟" };
function syncTier() {
  for (const k of Object.keys(TIER_HINT)) $("tier-" + k).checked = prefs.tier === k;
  $("tier-hint").textContent = TIER_HINT[prefs.tier];
}
for (const k of Object.keys(TIER_HINT)) $("tier-" + k).addEventListener("change", () => { prefs.tier = k; writeLocal(LS.prefs, prefs); syncTier(); });

const finePointer = window.matchMedia("(pointer: fine)").matches;
$("key-hint").textContent = finePointer ? "Enter 发送，Shift + Enter 换行" : "";
$("q").value = readLocal(LS.draft, "") || "";
let draftTimer = null;
$("q").addEventListener("input", () => { clearTimeout(draftTimer); draftTimer = setTimeout(() => writeLocal(LS.draft, $("q").value), 400); });
$("q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;
  if (finePointer ? !e.shiftKey : (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
});
$("composer").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
$("stop").addEventListener("click", () => { if (live) live.ctl.abort(); });
$("new-thread").addEventListener("click", async () => {
  if (live) { live.ctl.abort(); await live.done; }
  activeId = null; failure = null; fallbackId = null; showNote("");
  renderHistory(); renderConvo();
  window.scrollTo({ top: 0 });
  $("q").focus();
});

// ---- start ----
buildProfile();
syncTier();
if (wide()) { $("hist-box").open = true; $("prof-box").open = profileCount() < 3; }
renderHistory();
renderConvo();
initRemote();
</script>
