<title>职场英语课程目录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* Layout: one column of lesson rows (newest first); each row = lesson number, topic, contents, actions, personal log. */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6877;
    --line: #dde2ea;
    --accent: #1f4fa3;
    --accent-soft: #e6edf9;
    --done: #1d7a4c;
    --done-soft: #e5f4ec;
    --doing: #a86410;
    --doing-soft: #fbf0e0;
    --de: #5b3fa6;
    --de-soft: #ede8f8;
    --font-en: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161d; --surface: #19202a; --ink: #e8edf4; --muted: #9aa6b6; --line: #2a3442;
      --accent: #7ea6f0; --accent-soft: #1d2a40; --done: #5cc690; --done-soft: #16302a;
      --doing: #e9a654; --doing-soft: #3a2c17; --de: #b9a5f0; --de-soft: #2a2442; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161d; --surface: #19202a; --ink: #e8edf4; --muted: #9aa6b6; --line: #2a3442;
    --accent: #7ea6f0; --accent-soft: #1d2a40; --done: #5cc690; --done-soft: #16302a;
    --doing: #e9a654; --doing-soft: #3a2c17; --de: #b9a5f0; --de-soft: #2a2442; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-zh); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; }
  header { display: grid; gap: 6px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 4px; font: 500 13px/1.4 var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
  .summary b { color: var(--ink); font-weight: 500; }

  .lessons { display: grid; gap: 12px; }
  .lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 16px; }
  .no { grid-row: span 4; font: 700 30px/1 var(--font-num); color: var(--accent); }
  .no small { display: block; margin-top: 6px; font: 500 11px/1 var(--font-zh); color: var(--muted); letter-spacing: 0.08em; }
  .lesson h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pill { font: 600 12px/1 var(--font-zh); border-radius: 999px; padding: 4px 9px; background: var(--accent-soft); color: var(--muted); }
  .pill.doing { background: var(--doing-soft); color: var(--doing); }
  .pill.done { background: var(--done-soft); color: var(--done); }
  .pill.lang-en { background: var(--accent-soft); color: var(--accent); }
  .pill.lang-de { background: var(--de-soft); color: var(--de); }
  .lesson.de .no { color: var(--de); }
  .lesson.de .btn.primary { background: var(--de); border-color: var(--de); color: var(--surface); }
  .langs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; margin-top: 6px; justify-self: start; }
  .langs button { font: 600 13px/1 var(--font-zh); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .langs button[data-lang="de"][aria-pressed="true"] { background: var(--de-soft); color: var(--de); }
  .langs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { color: var(--muted); font-size: 13px; }
  .contents { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .contents span { font-size: 12.5px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font: 600 13.5px/1 var(--font-zh); text-decoration: none; border-radius: 6px; padding: 9px 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .log { grid-column: 2; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .log label { display: inline-flex; align-items: center; gap: 6px; }
  .log select { font: 13px var(--font-zh); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .log .dates { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .note { margin-top: 22px; color: var(--muted); font-size: 13px; }
  .status { font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) {
    .lesson { grid-template-columns: 1fr; }
    .no { grid-row: auto; font-size: 22px; display: flex; align-items: baseline; gap: 8px; }
    .no small { display: inline; margin: 0; }
    .log { grid-column: 1; }
  }
</style>

<div class="wrap">
  <header>
    <h1>职场英语 · 德语课程目录</h1>
    <p>项目经理 · 项目协调 · 现场售后方向。英语和德语课程都在这里，最新的在最上面；同一课号的英语和德语是同一个主题，可以对照着学。</p>
    <div class="summary" id="summary"></div>
    <div class="langs" role="group" aria-label="语言">
      <button id="lang-all" data-lang="all" aria-pressed="true">全部</button>
      <button id="lang-en" data-lang="en" aria-pressed="false">英语</button>
      <button id="lang-de" data-lang="de" aria-pressed="false">德语</button>
    </div>
    <div class="status" id="sync">学习记录保存在本浏览器</div>
  </header>

  <div class="lessons" id="lessons"></div>

  <p class="note">“网页练习”可以遮外语 / 遮中文、点开对照、听发音、打字练习，并标记会和不会；德语课的名词带冠词和复数，还能看英语对照。每次复习完点“今天复习了”，这里会记下日期。</p>
</div>

<script>
// Add one entry per new lesson, newest last; the page shows newest first.
const LESSONS = [
  {
    lang: "en",
    no: 1,
    title: "项目协调与现场售后",
    date: "2026-10-13",
    level: "B2–C1（雅思 6.0–7.0）",
    contents: ["60 个职业词组", "88 个行业词汇", "24 句中译英"],
    web: "https://claude.ai/artifact/L8f8cpGaYq1vNxqerM6UXY",
  },
  {
    lang: "de",
    no: 1,
    title: "项目协调与现场售后",
    date: "2026-10-14",
    level: "B1–C1（目标职场 C1）",
    pair: "和英语第 1 课同一主题",
    contents: ["60 个职业词组（含功能动词结构）", "112 个行业术语（带冠词）", "24 句 C1 句型中译德", "26 个德英易混"],
    web: "https://claude.ai/artifact/SWgDxto4AJ5h9R1kC1KwwP",
  },
];
const LANGS = { en: { name: "英语" }, de: { name: "德语" } };
// English lessons keep their original log key (the lesson number) so earlier records still match.
const keyOf = (l) => (l.lang === "en" ? String(l.no) : l.lang + "-" + l.no);

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---- language filter: a per-viewer convenience ----
let langFilter = "all";
try { langFilter = localStorage.getItem("course-lang") || "all"; } catch {}
if (langFilter !== "all" && !LANGS[langFilter]) langFilter = "all";
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => {
  langFilter = b.dataset.lang;
  try { localStorage.setItem("course-lang", langFilter); } catch {}
  render();
});

// ---- personal log: { [lessonKey]: { status, reviews: ["YYYY-MM-DD", ...] } } ----
const LOCAL = "course-log";
let log = {};
try { log = JSON.parse(localStorage.getItem(LOCAL) || "{}") || {}; } catch { log = {}; }
let remote = null, writing = Promise.resolve();
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function save() {
  try { localStorage.setItem(LOCAL, JSON.stringify(log)); } catch {}
  if (!remote) return;
  const body = { log: JSON.parse(JSON.stringify(log)), updatedAt: Date.now() };
  writing = writing.then(() => remote.set(body)).then(
    () => { $("sync").textContent = "学习记录已保存到你的账号"; },
    () => { $("sync").textContent = "学习记录暂存在本浏览器"; }
  );
}

const STATUS = [["todo", "未开始"], ["doing", "进行中"], ["done", "已完成"]];

function render() {
  const list = $("lessons");
  list.replaceChildren();
  const done = LESSONS.filter((l) => (log[keyOf(l)] || {}).status === "done").length;
  const reviews = LESSONS.reduce((s, l) => s + ((log[keyOf(l)] || {}).reviews || []).length, 0);
  const count = (lang) => LESSONS.filter((l) => l.lang === lang).length;
  $("summary").replaceChildren();
  for (const [k, v] of [["英语", count("en") + " 课"], ["德语", count("de") + " 课"], ["已完成", done], ["累计复习", reviews + " 次"]]) {
    const s = el("span", null, k + " "); s.append(el("b", null, String(v))); $("summary").append(s);
  }
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", String(b.dataset.lang === langFilter));

  for (const l of [...LESSONS].reverse()) {
    if (langFilter !== "all" && l.lang !== langFilter) continue;
    const key = keyOf(l);
    const rec = log[key] || { status: "todo", reviews: [] };
    const card = el("article", "lesson " + l.lang);
    const no = el("div", "no", String(l.no).padStart(2, "0")); no.append(el("small", null, "第 " + l.no + " 课"));
    const h = el("h2");
    h.append(el("span", "pill lang-" + l.lang, LANGS[l.lang].name), l.title);
    const st = STATUS.find(([k]) => k === rec.status) || STATUS[0];
    h.append(el("span", "pill " + st[0], st[1]));
    const meta = el("div", "meta", l.date + " · 难度 " + l.level + (l.pair ? " · " + l.pair : ""));
    const contents = el("div", "contents"); l.contents.forEach((c) => contents.append(el("span", null, c)));
    const actions = el("div", "actions");
    const web = el("a", "btn primary", "网页练习"); web.href = l.web; web.target = "_blank"; web.rel = "noopener";
    actions.append(web);
    const logRow = el("div", "log");
    const lab = el("label", null, "状态");
    const sel = el("select"); sel.id = "status-" + key;
    for (const [k, v] of STATUS) { const o = el("option", null, v); o.value = k; if (k === rec.status) o.selected = true; sel.append(o); }
    sel.addEventListener("change", () => { log[key] = { ...rec, status: sel.value }; save(); render(); });
    lab.append(sel);
    const rv = el("button", "btn", "今天复习了");
    const already = (rec.reviews || []).includes(today());
    if (already) { rv.textContent = "今天已复习"; rv.disabled = true; }
    rv.addEventListener("click", () => {
      const reviews = [...(rec.reviews || []), today()];
      log[key] = { ...rec, status: rec.status === "todo" ? "doing" : rec.status, reviews };
      save(); render();
    });
    const rs = rec.reviews || [];
    const dates = el("span", "dates", rs.length ? "复习 " + rs.length + " 次 · 最近 " + rs.slice(-3).reverse().join(" / ") : "还没有复习记录");
    logRow.append(lab, rv, dates);
    card.append(no, h, meta, contents, actions, logRow);
    list.append(card);
  }
}

render();

(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (db && uid) {
      remote = db.doc("data/users/" + uid + "/course-log");
      const snap = await remote.get();
      if (snap.exists) {
        const saved = snap.data().log || {};
        const merged = { ...log, ...saved };
        const changed = JSON.stringify(merged) !== JSON.stringify(saved);
        log = merged;
        try { localStorage.setItem(LOCAL, JSON.stringify(log)); } catch {}
        if (changed) save();
      } else if (Object.keys(log).length) {
        save();
      }
      $("sync").textContent = "学习记录已保存到你的账号";
    }
  } catch { remote = null; }
  render();
})();
</script>
