<title>职场英语第 1 课</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* Layout: sticky control bar (mode · filter · progress), then grouped card grids; cards stack to one column on phones. */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6877;
    --line: #dde2ea;
    --accent: #1f4fa3;
    --accent-soft: #e6edf9;
    --known: #1d7a4c;
    --known-soft: #e5f4ec;
    --unknown: #c2352b;
    --unknown-soft: #fcebea;
    --cover: #c9d1dd;
    --font-en: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161d; --surface: #19202a; --ink: #e8edf4; --muted: #9aa6b6; --line: #2a3442;
      --accent: #7ea6f0; --accent-soft: #1d2a40; --known: #5cc690; --known-soft: #16302a;
      --unknown: #f0786d; --unknown-soft: #3a1d1d; --cover: #3a4555; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161d; --surface: #19202a; --ink: #e8edf4; --muted: #9aa6b6; --line: #2a3442;
    --accent: #7ea6f0; --accent-soft: #1d2a40; --known: #5cc690; --known-soft: #16302a;
    --unknown: #f0786d; --unknown-soft: #3a1d1d; --cover: #3a4555; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-en), var(--font-zh); font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

  header.top { padding-block: 20px 8px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  header.top h1 { margin: 0; font-family: var(--font-zh); font-size: 22px; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
  header.top p { margin: 0; color: var(--muted); font-size: 13px; font-family: var(--font-zh); }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .tabs, .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button, .seg button {
    font: 600 13px/1 var(--font-zh); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 8px 11px; cursor: pointer; white-space: nowrap;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .label { font: 500 12px/1 var(--font-zh); color: var(--muted); letter-spacing: 0.04em; }
  .ctl { display: inline-flex; align-items: center; gap: 6px; }
  .stats { margin-left: auto; display: inline-flex; gap: 12px; font: 500 13px/1 var(--font-num); font-variant-numeric: tabular-nums; }
  .stats .k { color: var(--known); } .stats .u { color: var(--unknown); } .stats .n { color: var(--muted); }
  .meter { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: flex; }
  .meter i { display: block; height: 100%; }
  .meter .mk { background: var(--known); } .meter .mu { background: var(--unknown); }
  .tool { font: 500 13px/1 var(--font-zh); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; cursor: pointer; }
  .tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .tool.danger { color: var(--unknown); }
  .sync { font: 12px/1 var(--font-zh); color: var(--muted); }
  .confirm { display: inline-flex; gap: 6px; align-items: center; font: 13px/1 var(--font-zh); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 500 12.5px/1 var(--font-zh); border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  section.group { margin-top: 22px; }
  section.group h2 { margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; font: 700 15px/1.2 var(--font-zh); }
  section.group h2 small { font: 400 12px/1 var(--font-en); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  section.group h2 .cnt { margin-left: auto; font: 500 12px/1 var(--font-num); color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  @media (max-width: 480px) { .grid, .grid.wide { grid-template-columns: 1fr; } }

  .card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: 6px; padding: 9px 10px 9px 11px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; min-width: 0;
  }
  .card.known { border-left-color: var(--known); }
  .card.unknown { border-left-color: var(--unknown); background: var(--unknown-soft); }
  .face { min-width: 0; cursor: pointer; display: grid; gap: 3px; border-radius: 4px; }
  .face:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .en { font: 600 15px/1.35 var(--font-en); overflow-wrap: anywhere; }
  .zh { font: 400 14px/1.45 var(--font-zh); color: var(--muted); overflow-wrap: anywhere; }
  .sent .zh { color: var(--ink); font-size: 15px; }
  .sent .en { font-weight: 400; font-size: 14.5px; color: var(--muted); }
  .num { font: 500 11px/1 var(--font-num); color: var(--muted); margin-right: 6px; }
  .covered * { color: transparent !important; border-color: transparent !important; }
  .ex { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); display: grid; gap: 2px; }
  .ex-en { font: 400 14.5px/1.5 var(--font-en); overflow-wrap: anywhere; }
  .ex-zh { font: 400 13.5px/1.5 var(--font-zh); color: var(--muted); overflow-wrap: anywhere; }
  .hl { font-weight: 700; color: var(--accent); }
  .story { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 8px; }
  .story-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font: 13px/1.4 var(--font-zh); }
  .story-en { font: 400 15px/1.75 var(--font-en); cursor: pointer; border-radius: 4px; overflow-wrap: anywhere; }
  .story-zh { font: 400 14px/1.75 var(--font-zh); color: var(--muted); cursor: pointer; border-radius: 4px; }
  .verdict.near { color: var(--known); }
  .verdict .need { color: var(--muted); }
  .covered { color: transparent !important; background: repeating-linear-gradient(135deg, var(--cover) 0 6px, transparent 6px 10px); border-radius: 3px; user-select: none; }
  .covered .num { color: transparent; }
  .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; }
  .say, .ask { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: 600 12px/1 var(--font-zh); border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .say svg, .ask svg { width: 14px; height: 14px; fill: currentColor; }
  .say.playing { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mk-btn { font: 600 12px/1 var(--font-zh); border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; padding: 7px 8px; cursor: pointer; min-width: 40px; }
  .mk-btn.k[aria-pressed="true"] { background: var(--known); border-color: var(--known); color: #fff; }
  .mk-btn.u[aria-pressed="true"] { background: var(--unknown); border-color: var(--unknown); color: #fff; }
  .card.unknown .mk-btn { background: var(--surface); }
  .card.unknown .mk-btn.u[aria-pressed="true"] { background: var(--unknown); }

  .typer { grid-column: 1 / -1; display: grid; gap: 5px; margin-top: 2px; }
  .type-in { display: block; width: 100%; min-width: 0; resize: none; overflow: hidden; font: 500 15px/1.45 var(--font-en); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .type-in::placeholder { color: var(--muted); font-family: var(--font-zh); font-size: 13px; }
  .type-in:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .type-in.ok { border-color: var(--known); background: var(--known-soft); }
  .type-in.bad { border-color: var(--unknown); background: var(--surface); }
  .verdict { font: 13px/1.5 var(--font-zh); overflow-wrap: anywhere; }
  .verdict.ok { color: var(--known); font-weight: 600; }
  .verdict.bad { color: var(--ink); }
  .verdict .tag { color: var(--unknown); font-weight: 600; margin-right: 6px; }
  .verdict .ans { font-family: var(--font-en); }
  .verdict .miss { color: var(--unknown); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .tally { font: 500 13px/1 var(--font-num); color: var(--accent); font-variant-numeric: tabular-nums; }
  /* explanation drawer */
  .scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, 0.35); z-index: 20; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 21;
    background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(10, 16, 24, 0.18);
    display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (max-width: 560px) { .drawer { top: auto; height: 86%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; } }
  .dr-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
  .dr-head .t-en { font: 700 18px/1.3 var(--font-en); overflow-wrap: anywhere; }
  .dr-head .t-zh { font: 14px/1.4 var(--font-zh); color: var(--muted); }
  .dr-close { font: 600 13px/1 var(--font-zh); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .dr-body { overflow-y: auto; padding: 14px 16px 18px; font: 14.5px/1.65 var(--font-zh); min-width: 0; }
  .dr-body h4 { margin: 14px 0 4px; font: 700 14px/1.4 var(--font-zh); color: var(--accent); }
  .dr-body h4:first-child { margin-top: 0; }
  .dr-body p { margin: 4px 0; }
  .dr-body ul, .dr-body ol { margin: 4px 0; padding-left: 20px; }
  .dr-body li { margin: 2px 0; }
  .dr-body .q-you { margin: 16px 0 6px; padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-weight: 500; }
  .dr-body .thinking { color: var(--muted); }
  .dr-body .err { color: var(--unknown); }
  .dr-foot { border-top: 1px solid var(--line); padding: 10px 16px 12px; display: grid; gap: 8px; }
  .ask-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .ask-in { min-width: 0; font: 14px/1.3 var(--font-zh); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 9px 10px; }
  .ask-in:focus { outline: none; border-color: var(--accent); }
  .dr-btn { font: 600 13px/1 var(--font-zh); border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 9px 12px; cursor: pointer; white-space: nowrap; }
  .dr-btn.ghost { background: var(--surface); color: var(--accent); }
  .dr-btn[disabled] { opacity: 0.5; cursor: default; }
  .dr-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 12px/1.4 var(--font-zh); color: var(--muted); }
  .copybox { width: 100%; font: 13px/1.5 var(--font-zh); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
  .empty { margin-top: 28px; padding: 22px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-family: var(--font-zh); text-align: center; }
  .hint { margin-top: 10px; color: var(--muted); font: 13px/1.5 var(--font-zh); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { .stats { margin-left: 0; } }
  @media (prefers-reduced-motion: no-preference) { .card { transition: background .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>职场英语 · 第 1 课</h1>
    <p>项目协调与现场售后 · 60 个职业词组 · 88 个行业词汇（都带例句） · 5 篇情景短文 · 24 句中译英</p>
  </header>

  <div class="bar" id="bar">
    <div class="row">
      <div class="tabs" role="group" aria-label="内容">
        <button id="tab-phrases" data-tab="phrases" aria-pressed="true">职业词组</button>
        <button id="tab-industry" data-tab="industry" aria-pressed="false">行业词汇</button>
        <button id="tab-stories" data-tab="stories" aria-pressed="false">情景短文</button>
        <button id="tab-sentences" data-tab="sentences" aria-pressed="false">中译英</button>
      </div>
      <div class="stats" aria-live="polite"><span class="k" id="st-k">会 0</span><span class="u" id="st-u">不会 0</span><span class="n" id="st-n">未标 0</span></div>
    </div>
    <div class="meter" aria-hidden="true"><i class="mk" id="m-k"></i><i class="mu" id="m-u"></i></div>
    <div class="row">
      <span class="ctl"><span class="label">遮盖</span>
        <span class="seg" role="group" aria-label="遮盖">
          <button id="cov-none" data-cover="none" aria-pressed="false">不遮</button>
          <button id="cov-en" data-cover="en" aria-pressed="true">遮英文</button>
          <button id="cov-zh" data-cover="zh" aria-pressed="false">遮中文</button>
        </span>
      </span>
      <span class="ctl"><span class="label">显示</span>
        <span class="seg" role="group" aria-label="显示">
          <button id="flt-all" data-filter="all" aria-pressed="true">全部</button>
          <button id="flt-review" data-filter="review" aria-pressed="false">待复习</button>
          <button id="flt-unknown" data-filter="unknown" aria-pressed="false">只看不会</button>
        </span>
      </span>
      <span class="ctl" id="speed-ctl"><span class="label">发音</span>
        <span class="seg" role="group" aria-label="语速">
          <button id="spd-normal" data-speed="0.95" aria-pressed="true">正常</button>
          <button id="spd-slow" data-speed="0.7" aria-pressed="false">慢速</button>
        </span>
      </span>
      <button class="tool" id="typing" aria-pressed="true">打字练习</button>
      <span class="tally" id="tally" hidden></span>
      <button class="tool" id="shuffle" aria-pressed="false">打乱顺序</button>
      <span id="reset-wrap"><button class="tool danger" id="reset">清除本页标记</button></span>
      <span class="sync" id="sync">标记保存在本浏览器</span>
    </div>
    <div class="chips" id="chips" hidden></div>
  </div>

  <p class="hint" id="hint">先看例句理解词组：读一遍、点“发音”听一遍、跟读一遍。再选<b>遮英文</b>，看中文<b>默写整句英文</b>，<b>回车</b>检查：整句对，或者句子略有不同但词组用对了，都自动标“会”；词组没用对标“不会”并显示参考答案。<b>Tab</b> 跳到下一句，Shift+Tab 回上一句；手机上检查后再按一次回车也会跳到下一句。点卡片可以临时翻开英文。</p>
  <main id="list"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-en" hidden>
  <div class="dr-head">
    <div><div class="t-en" id="dr-en"></div><div class="t-zh" id="dr-zh"></div></div>
    <button class="dr-close" id="dr-close">关闭</button>
  </div>
  <div class="dr-body" id="dr-body" aria-live="polite"></div>
  <div class="dr-foot">
    <div class="ask-row" id="ask-row">
      <input class="ask-in" id="ask-in" type="text" placeholder="继续问，比如：和 start the project 有什么区别？" autocomplete="off">
      <button class="dr-btn" id="ask-send">发送</button>
    </div>
    <div class="dr-tools">
      <button class="dr-btn ghost" id="dr-stop" hidden>停止</button>
      <button class="dr-btn ghost" id="dr-regen">重新解释</button>
      <button class="dr-btn ghost" id="dr-copy">复制问题</button>
      <span id="dr-note"></span>
    </div>
  </div>
</aside>

function parseMarked(m) {
  const parts = m.split(/(\[\[.+?\]\])/).filter(Boolean).map((t) => /^\[\[.+\]\]$/.test(t) ? { t: t.slice(2, -2), hl: true } : { t, hl: false });
  return { parts, plain: parts.map((p) => p.t).join(""), keys: parts.filter((p) => p.hl).map((p) => p.t) };
}

  if (!state.shuffle) return list;

// ---- typing practice ----
function norm(t) {
  return t.toLowerCase()
    .replace(/[‘’ʼ`]/g, "'")
    .replace(/won't/g, "will not").replace(/can't|cannot/g, "can not").replace(/n't\b/g, " not")
    .replace(/\bcant\b/g, "can not").replace(/\b(do|does|did|is|are|was|were|have|has|had|could|should|would)nt\b/g, "$1 not").replace(/'ll\b/g, " will").replace(/'re\b/g, " are").replace(/'ve\b/g, " have").replace(/'m\b/g, " am").replace(/'d\b/g, " would")
    .replace(/[-–—_/]/g, " ")
    .replace(/[^a-z0-9' ]+/g, " ")
    .replace(/\s+/g, " ").trim();
}
function answers(en) {
  let forms = [en];
  if (en.includes(" / ")) forms = forms.concat(en.split(" / "));
  const out = new Set();
  for (const f of forms) {
    for (const sb of ["sb.", "somebody", "someone"]) for (const sth of ["sth.", "something"]) {
      out.add(norm(f.replace(/\bsb\./g, sb).replace(/\bsth\./g, sth)));
    }
  }
  return out;
}
function isCorrect(value, item) { return answers(item.target).has(norm(value)); }
// "ok": matches the reference; "near": every key phrase is right and the sentence is mostly there; "bad": otherwise.
function verdictFor(value, item) {
  if (isCorrect(value, item)) return "ok";
  const v = norm(value);
  if (item.keys.length && v.split(" ").length >= 0.6 * norm(item.target).split(" ").length) {
    const padded = " " + v + " ";
    if (item.keys.every((k) => k.split("|").some((a) => padded.includes(" " + norm(a))))) return "near";
  }
  return "bad";
}
// Words of the reference answer that the typed answer did not match (longest common subsequence on words).
function same(ref, w) {
  return ref === w || (ref === "sb" && (w === "somebody" || w === "someone")) || (ref === "sth" && w === "something");
}
function missedWords(value, en) {
  const words = en.split(/\s+/);
  const parts = [];  // [wordIndex, normalizedPart]
  words.forEach((w, wi) => norm(w).split(" ").filter(Boolean).forEach((p) => parts.push([wi, p])));
  const a = norm(value).split(" ").filter(Boolean);
  const L = Array.from({ length: parts.length + 1 }, () => new Array(a.length + 1).fill(0));
  for (let i = parts.length - 1; i >= 0; i--) for (let j = a.length - 1; j >= 0; j--)
    L[i][j] = same(parts[i][1], a[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const hit = new Array(parts.length).fill(false);
  for (let i = 0, j = 0; i < parts.length && j < a.length;) {
    if (same(parts[i][1], a[j])) { hit[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  const ok = words.map(() => true);
  parts.forEach(([wi], k) => { if (!hit[k]) ok[wi] = false; });
  return words.map((w, i) => [w, ok[i]]);
}

function focusInput(id) {

  return !!inp;
}
function moveFocus(fromId, dir) {
  const all = [...document.querySelectorAll(".type-in")];
  const i = all.findIndex((x) => x.dataset.id === fromId);
  const next = all[i + dir];
  if (next) { next.focus({ preventScroll: true }); next.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function checkTyped(item, value) {
  const result = verdictFor(value, item);
  typed[item.id] = { value, result };
  sticky.add(item.id);
  state.revealed.add(item.id);
  setMark(item.id, result === "bad" ? "u" : "k");
}
// Grow the answer box with its text so a long sentence stays fully visible.
function fitBox(box) { box.style.height = "auto"; box.style.height = box.scrollHeight + 2 + "px"; }
function typer(item) {
  const box = el("div", "typer");
  const t = typed[item.id] || { value: "", result: null };
  const inp = el("textarea", "type-in" + (t.result ? " " + t.result : ""));
  inp.rows = 2; inp.id = "type-" + item.id; inp.dataset.id = item.id; inp.value = t.value;
  inp.placeholder = item.ex ? "看中文例句，默写整句英文，回车检查" : "看中文，写出整句英文，回车检查";
  inp.setAttribute("aria-label", "输入英文：" + item.zh);
  for (const [k, v] of [["autocomplete", "off"], ["autocapitalize", "off"], ["autocorrect", "off"], ["spellcheck", "false"], ["lang", "en"], ["enterkeyhint", "next"]]) inp.setAttribute(k, v);
  inp.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.key === "Enter") {
      e.preventDefault();
      const cur = typed[item.id];
      if (cur && cur.result && cur.value === inp.value) moveFocus(item.id, 1);
      else checkTyped(item, inp.value);
    } else if (e.key === "Tab") {
      e.preventDefault();

  inp.addEventListener("input", () => {
    fitBox(inp);
    typed[item.id] = { value: inp.value, result: null };
    inp.classList.remove("ok", "near", "bad");
    const v = box.querySelector(".verdict"); if (v) v.remove();
  });
  box.append(inp);
  const reference = () => {
    const ans = el("span", "ans");
    missedWords(t.value, item.target).forEach(([w, okw], i) => { if (i) ans.append(" "); ans.append(okw ? document.createTextNode(w) : el("span", "miss", w)); });
    return ans;
  };
  if (t.result === "ok") box.append(el("div", "verdict ok", "✓ 完全正确"));
  if (t.result === "near") {
    const v = el("div", "verdict near");
    v.append(el("b", null, "✓ 词组用对了"), "，句子和参考答案略有不同：");
    v.append(reference());
    box.append(v);
  }
  if (t.result === "bad") {
    const v = el("div", "verdict bad");
    v.append(el("span", "tag", t.value.trim() ? "✗ 不对" : "✗ 没填"));
    v.append("参考答案：", reference());
    if (item.keys.length) v.append(el("div", "need", "要用到：" + item.keys.map((k) => k.split("|")[0]).join(" / ")));
    box.append(v);

}

function marked(parts, cls) {
  const d = el("div", cls);
  for (const p of parts) d.append(p.hl ? el("span", "hl", p.t) : document.createTextNode(p.t));
  return d;
}
function speakText(item) { return item.ex ? item.en + ". " + item.target : item.en; }
const SPEAKER_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

function card(item) {
  const m = state.marks[item.id];
  const sentence = !item.ex;
  const c = el("div", "card" + (sentence ? " sent" : "") + (m === "k" ? " known" : m === "u" ? " unknown" : ""));
  const face = el("div", "face");
  face.tabIndex = 0;
  face.setAttribute("role", "button");
  const shown = state.revealed.has(item.id);
  const cover = (node, kind) => { if (state.cover === kind && !shown) node.classList.add("covered"); return node; };
  if (item.ex) {
    const en = el("div", "en"); en.append(el("span", "num", String(item.n)), item.en);
    face.append(cover(en, "en"), cover(el("div", "zh", item.zh), "zh"));
    const ex = el("div", "ex");
    ex.append(cover(marked(item.ex.parts, "ex-en"), "en"), cover(el("div", "ex-zh", item.ex.zh), "zh"));
    face.append(ex);
  } else {
    const zh = el("div", "zh"); zh.append(el("span", "num", String(item.n)), item.zh);
    face.append(cover(zh, "zh"), cover(item.parts ? marked(item.parts, "en") : el("div", "en", item.en), "en"));
  }
  face.setAttribute("aria-label", state.cover === "none" ? "卡片" : (shown ? "点击重新遮住" : "点击显示"));
  const toggle = () => { if (state.cover === "none") return; shown ? state.revealed.delete(item.id) : state.revealed.add(item.id); render(); };
  face.addEventListener("click", toggle);
  face.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  const marks = el("div", "marks");
  for (const [v, label] of [["k", "会"], ["u", "不会"]]) {
    const b = el("button", "mk-btn " + v, label);
    b.setAttribute("aria-pressed", String(m === v));
    b.addEventListener("click", () => setMark(item.id, m === v ? null : v));
    marks.append(b);
  }
  if (canSpeak) {
    const say = el("button", "say");
    say.innerHTML = SPEAKER_ICON;
    say.append(document.createTextNode("发音"));
    say.setAttribute("aria-label", "播放发音：" + item.en);
    say.addEventListener("click", () => speak(speakText(item), say));
    marks.append(say);
  }
  const ask = el("button", "ask");
  ask.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>';
  ask.append(document.createTextNode("解释"));
  ask.setAttribute("aria-label", "让 Claude 解释：" + item.en);
  ask.addEventListener("click", () => openExplain(item, ask));
  marks.append(ask);
  c.append(face, marks);
  if (typingOn()) c.append(typer(item));
  return c;
}

// The whole passage above its sentence cards: read it, listen to it, then write it sentence by sentence.
function storyBlock(st) {
  const box = el("div", "story");
  const top = el("div", "story-top");
  top.append(el("span", null, "场景：" + st.scene));
  if (canSpeak) {
    const say = el("button", "say");
    say.innerHTML = SPEAKER_ICON;
    say.append(document.createTextNode("播放全文"));
    say.addEventListener("click", () => speak(st.sents.map((x) => x.target).join(" "), say));
    top.append(say);
  }
  box.append(top);
  const key = "story-" + st.gi;
  const shown = state.revealed.has(key);
  const toggle = () => { if (state.cover === "none") return; shown ? state.revealed.delete(key) : state.revealed.add(key); render(); };
  const en = el("div", "story-en");
  st.sents.forEach((x, i) => { if (i) en.append(" "); for (const p of x.parts) en.append(p.hl ? el("span", "hl", p.t) : document.createTextNode(p.t)); });
  const zh = el("div", "story-zh", st.sents.map((x) => x.zh).join(""));
  for (const [node, kind] of [[en, "en"], [zh, "zh"]]) {
    if (state.cover === kind && !shown) node.classList.add("covered");
    node.addEventListener("click", toggle);
    box.append(node);
  }
  return box;
}

function render() {
  const act = document.activeElement;
  const focusId = act && act.classList && act.classList.contains("type-in") ? act.dataset.id : null;
  const caret = focusId ? act.selectionStart : null;
  renderView();
  document.querySelectorAll(".type-in").forEach(fitBox);
  if (focusId) {
    const inp = document.querySelector('.type-in[data-id="' + focusId + '"]');
    if (inp) { inp.focus({ preventScroll: true }); try { inp.setSelectionRange(caret, caret); } catch {} }
  }
}
function renderView() {
  const tab = state.tab;
  for (const b of document.querySelectorAll("[data-tab]")) b.setAttribute("aria-pressed", String(b.dataset.tab === tab));
  for (const b of document.querySelectorAll("[data-cover]")) b.setAttribute("aria-pressed", String(b.dataset.cover === state.cover));
  for (const b of document.querySelectorAll("[data-filter]")) b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter));
  $("shuffle").setAttribute("aria-pressed", String(state.shuffle));
  $("typing").setAttribute("aria-pressed", String(state.typing));
  const tl = $("tally"); tl.hidden = !typingOn();
  if (typingOn()) {
    const ids = new Set(ITEMS[tab].map((i) => i.id));
    const res = Object.entries(typed).filter(([id, t]) => ids.has(id) && t.result);
    tl.textContent = "本轮打字 对 " + res.filter(([, t]) => t.result !== "bad").length + " / " + res.length;
  }
  for (const b of document.querySelectorAll("[data-speed]")) b.setAttribute("aria-pressed", String(Number(b.dataset.speed) === (state.speed || 0.95)));

  // industry chips
  const chips = $("chips");
  chips.hidden = tab !== "industry";
  if (tab === "industry") {
    chips.replaceChildren();
    const all = el("button", "chip", "全部行业");
    all.setAttribute("aria-pressed", String(state.industries.length === 0));
    all.addEventListener("click", () => { state.industries = []; savePrefs(); render(); });
    chips.append(all);
    for (const name of INDUSTRIES) {
      const b = el("button", "chip", name);
      const on = state.industries.includes(name);
      b.setAttribute("aria-pressed", String(on));
      b.addEventListener("click", () => {
        state.industries = on ? state.industries.filter((x) => x !== name) : [...state.industries, name];
        savePrefs(); render();
      });
      chips.append(b);
    }
  }

  let pool = ITEMS[tab];
  if (tab === "industry" && state.industries.length) pool = pool.filter((i) => state.industries.includes(i.group));

  // stats for the current pool (before the display filter)
  const k = pool.filter((i) => state.marks[i.id] === "k").length;
  const u = pool.filter((i) => state.marks[i.id] === "u").length;
  $("st-k").textContent = "会 " + k; $("st-u").textContent = "不会 " + u; $("st-n").textContent = "未标 " + (pool.length - k - u);
  $("m-k").style.width = (pool.length ? (k / pool.length) * 100 : 0) + "%";
  $("m-u").style.width = (pool.length ? (u / pool.length) * 100 : 0) + "%";

  const list = $("list");
  list.replaceChildren();
  const shown = pool.filter(visible);
  if (!shown.length) {
    const msg = state.filter === "unknown" ? "这一页没有标成“不会”的条目。" : "这一页的条目都已经标成“会”了。切到“全部”可以重新看。";
    list.append(el("div", "empty", msg));
    return;
  }
  if (state.shuffle) {
    const sec = el("section", "group");
    const h = el("h2", null, "打乱顺序"); h.append(el("span", "cnt", shown.length + " 条"));
    const grid = el("div", "grid wide");
    shuffled(shown, tab + state.industries.join()).forEach((i) => grid.append(card(i)));
    sec.append(h, grid); list.append(sec);
    return;
  }
  const groups = [...new Set(shown.map((i) => i.group))];
  for (const g of groups) {
    const items = shown.filter((i) => i.group === g);
    const sec = el("section", "group");
    const h = el("h2", null, g);
    if (items[0].groupEn) h.append(el("small", null, items[0].groupEn));
    h.append(el("span", "cnt", items.length + " 条"));
    sec.append(h);
    if (tab === "stories") sec.append(storyBlock(STORIES[items[0].story]));
    const grid = el("div", "grid wide");
    items.forEach((i) => grid.append(card(i)));
    sec.append(grid); list.append(sec);

// ---- pronunciation (the browser's built-in English voice) ----
const synth = window.speechSynthesis;
const canSpeak = !!(synth && window.SpeechSynthesisUtterance);
let voice = null;
function pickVoice() {
  if (!canSpeak) return;
  const vs = synth.getVoices().filter((v) => /^en[-_]/i.test(v.lang));
  const rank = (v) => (/en[-_]US/i.test(v.lang) ? 0 : /en[-_]GB/i.test(v.lang) ? 1 : 2) * 10
    + (/(natural|neural|google|samantha|aria|jenny|ava|alex)/i.test(v.name) ? 0 : 5) + (v.localService ? 0 : 1);
  voice = vs.sort((a, b) => rank(a) - rank(b))[0] || null;
}
if (canSpeak) { pickVoice(); synth.addEventListener?.("voiceschanged", pickVoice); }
function spoken(text) {
  return text.replace(/\bsb\./g, "somebody").replace(/\bsth\./g, "something").replace(/\s\/\s/g, ", or ");
}
let playingBtn = null;
function speak(text, btn) {
  if (!canSpeak) return;
  synth.cancel();
  if (playingBtn) playingBtn.classList.remove("playing");
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.lang = voice ? voice.lang : "en-US";
  if (voice) u.voice = voice;
  u.rate = state.speed || 0.95;
  playingBtn = btn; btn.classList.add("playing");
  const done = () => { btn.classList.remove("playing"); if (playingBtn === btn) playingBtn = null; };
  u.onend = done; u.onerror = done;
  synth.speak(u);
}

// ---- explanations from Claude ----
let sampleFn = null;        // claude.use("sample") result, null when unavailable
let sampleBlocked = false;  // viewer declined or Claude unavailable in this view
let dbRef = null, userId = null;
const explainCache = {};    // id -> turns
let cur = null;             // { item, turns, ctl, opener }
let lastError = "";

const KIND = { phrases: "职场词组", industry: "行业词汇", stories: "句子", sentences: "句子" };
function kindOf(item) { return item.id[0] === "p" ? "phrases" : item.id[0] === "i" ? "industry" : "sentences"; }
function exampleLine(item) { return item.ex ? "\n课本例句：" + item.target + "（" + item.ex.zh + "）" : ""; }
const LEARNER = "学习者：中文母语，英语大约雅思 5 分，目标是能在项目经理、项目协调、现场售后工作中开口说英语（行业可能是医疗、电气、制造、汽车、电子、物流、采购）。";
function promptFor(item) {
  const k = kindOf(item);
  if (k === "sentences") {
    return "你是职场英语老师。" + LEARNER + "\n请用中文讲解下面这个句子，英文部分保持英文。\n中文：" + item.zh + "\n参考英文：" + item.en +
      "\n\n按下面的结构输出，每部分 2-4 行，简洁，不要开场白和结束语：\n### 句子结构\n### 关键词组\n### 更口语的说法\n### 更正式的说法（写邮件用）\n### 中国人常见错误";
  }
  return "你是职场英语老师。" + LEARNER + "\n请用中文讲解下面这个" + KIND[k] + "，英文例句保持英文。\n条目：" + item.en + "（" + item.zh + "）" + exampleLine(item) +
    "\n\n按下面的结构输出，简洁，不要开场白和结束语：\n### 意思和用法\n### 常见搭配（3-5 个）\n### 工作例句（3 句，项目或现场售后场景，每句后面附中文）\n### 中国人常见错误（1-2 条）\n### 近义说法（如果有）";
}
function copyPromptFor(item) {
  return kindOf(item) === "sentences"
    ? "请讲解这个职场英语句子：" + item.en + "（" + item.zh + "）。包括句子结构、关键词组、更口语和更正式的说法、常见错误。不需要讲发音。"
    : "请讲解这个职场英语" + KIND[kindOf(item)] + "：" + item.en + "（" + item.zh + "）。包括意思用法、常见搭配、3 个项目或现场售后场景的例句、中国人常见错误、近义说法。不需要讲发音。";
}

// Minimal Markdown to DOM (headings, lists, bold) without innerHTML.
function inline(parent, text) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  for (const part of parts) {
    if (/^\*\*[^*]+\*\*$/.test(part)) parent.append(el("strong", null, part.slice(2, -2)));
    else if (part) parent.append(document.createTextNode(part));
  }
}
function renderMarkdown(text, into) {
  let list = null, skip = false;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    const h = line.match(/^#{1,6}\s+(.*)$/);
    if (h) skip = /发音/.test(h[1]);   // pronunciation notes are left out on purpose
    if (skip) continue;
    const ul = line.match(/^\s*[-*•]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (h) { list = null; const e = el("h4"); inline(e, h[1]); into.append(e); }
    else if (ul || ol) {
      const tag = ul ? "UL" : "OL";
      if (!list || list.tagName !== tag) { list = el(tag.toLowerCase()); into.append(list); }
      const li = el("li"); inline(li, (ul || ol)[1]); list.append(li);
    } else if (line.trim()) { list = null; const p = el("p"); inline(p, line); into.append(p); }
    else list = null;
  }
}

function drawTurns(streaming) {
  const body = $("dr-body");
  body.replaceChildren();
  const turns = cur.turns;
  for (let i = 1; i < turns.length; i++) {
    const t = turns[i];
    if (t.role === "user") body.append(el("div", "q-you", t.content));
    else { const box = el("div"); renderMarkdown(t.content, box); body.append(box); }
  }
  if (streaming !== undefined) {
    const box = el("div");
    if (streaming) renderMarkdown(streaming, box); else box.append(el("p", "thinking", "Claude 正在写解释……"));
    body.append(box);
    return box;
  }
}

function setBusy(busy) {
  $("dr-stop").hidden = !busy;
  $("ask-send").disabled = busy;
  $("dr-regen").disabled = busy;
}

async function saveExplain(item) {
  explainCache[item.id] = cur.turns;
  if (!dbRef || !userId) return;
  try { await dbRef.doc("data/users/" + userId + "/explain-" + item.id).set({ turns: cur.turns, updatedAt: Date.now() }); } catch {}
}

const ERRORS = {
  rate_limited: "请求太频繁或已到使用上限，稍后再试。",
  session_expired: "登录已过期，请重新登录 claude.ai 后再试。",
  refused: "Claude 没有回答这个问题，换个问法试试。",
  empty_completion: "没有得到回答，换个问法试试。",
  upstream_error: "连接中断了，点“重新解释”或再发一次。",
};

async function runSample(item, turns) {
  if (!sampleFn || sampleBlocked) { showCopyFallback(item); return null; }
  const ctl = new AbortController();
  cur.ctl = ctl;
  setBusy(true);
  let box = drawTurns("");
  $("dr-note").textContent = ""; lastError = "已停止。";
  try {
    const input = turns.length === 1 ? turns[0].content : turns;
    const { text } = await sampleFn(input, {
      modelTier: "quick", signal: ctl.signal, cache: turns.length === 1 ? true : false,
      onText: ({ text }) => { if (cur && cur.item === item) { box.replaceChildren(); renderMarkdown(text, box); } },
    });
    return text;
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled") { $("dr-note").textContent = "已停止。"; return e.text || null; }
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      sampleBlocked = true; showCopyFallback(item); return null;
    }
    lastError = ERRORS[code] || ERRORS.upstream_error;
    box.replaceChildren(); if (e && e.text) renderMarkdown(e.text, box);
    box.append(el("p", "err", lastError));
    return null;
  } finally {
    if (cur) { cur.ctl = null; setBusy(false); }
  }
}

function showCopyFallback(item) {
  const body = $("dr-body");
  body.replaceChildren();
  body.append(el("p", null, "这里暂时不能直接调用 Claude（可能是没有允许，或当前环境不支持）。可以复制下面的问题，粘贴到 Claude 对话里问："));
  const ta = el("textarea", "copybox"); ta.rows = 4; ta.value = copyPromptFor(item); ta.readOnly = true; ta.id = "copy-" + item.id;
  body.append(ta);
  $("ask-row").hidden = true; $("dr-regen").hidden = true;
}

async function loadSaved(item) {
  if (explainCache[item.id]) return explainCache[item.id];
  if (!dbRef || !userId) return null;
  try {
    const snap = await dbRef.doc("data/users/" + userId + "/explain-" + item.id).get();
    if (snap.exists && Array.isArray(snap.data().turns)) return (explainCache[item.id] = snap.data().turns);
  } catch {}
  return null;
}

async function openExplain(item, opener) {
  if (cur && cur.ctl) cur.ctl.abort();
  cur = { item, turns: [{ role: "user", content: promptFor(item) }], ctl: null, opener };
  $("dr-en").textContent = item.en; $("dr-zh").textContent = item.zh;
  $("ask-row").hidden = false; $("dr-regen").hidden = false; $("dr-note").textContent = "";
  $("ask-in").value = "";
  $("drawer").hidden = false; $("scrim").hidden = false;
  $("dr-close").focus();
  const saved = await loadSaved(item);
  if (!cur || cur.item !== item) return;
  if (saved && saved.length > 1) { cur.turns = saved.map((t) => ({ ...t })); drawTurns(); $("dr-note").textContent = "这是之前保存的解释。"; return; }
  const text = await runSample(item, cur.turns);
  if (text && cur && cur.item === item) { cur.turns.push({ role: "assistant", content: text }); drawTurns(); saveExplain(item); }
}

async function askFollowUp() {
  if (!cur || cur.ctl) return;
  const q = $("ask-in").value.trim();
  if (!q) return;
  if (cur.turns.length < 2) return;
  const item = cur.item;
  $("ask-in").value = "";
  cur.turns.push({ role: "user", content: q });
  const recent = [cur.turns[0], ...cur.turns.slice(1).slice(-12)];
  const text = await runSample(item, recent);
  if (cur && cur.item === item) {
    if (text) { cur.turns.push({ role: "assistant", content: text }); drawTurns(); saveExplain(item); }
    else if (!sampleBlocked) { cur.turns.pop(); drawTurns(); $("ask-in").value = q; $("dr-note").textContent = lastError; }
  }
}

function closeExplain() {
  if (!cur) return;
  if (cur.ctl) cur.ctl.abort();
  const opener = cur.opener; cur = null;
  $("drawer").hidden = true; $("scrim").hidden = true;
  if (opener && opener.isConnected) opener.focus();
}

$("dr-close").addEventListener("click", closeExplain);
$("scrim").addEventListener("click", closeExplain);
$("dr-stop").addEventListener("click", () => { if (cur && cur.ctl) cur.ctl.abort(); });
$("ask-send").addEventListener("click", askFollowUp);
$("ask-in").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); askFollowUp(); } });
$("dr-regen").addEventListener("click", async () => {
  if (!cur || cur.ctl) return;
  const item = cur.item;
  cur.turns = [{ role: "user", content: promptFor(item) }];
  delete explainCache[item.id];
  const text = await runSample(item, cur.turns);
  if (text && cur && cur.item === item) { cur.turns.push({ role: "assistant", content: text }); drawTurns(); saveExplain(item); }
});
$("dr-copy").addEventListener("click", async () => {
  if (!cur) return;
  const text = copyPromptFor(cur.item);
  try { await navigator.clipboard.writeText(text); $("dr-note").textContent = "已复制，可以粘贴到 Claude 对话里。"; }
  catch { showCopyFallback(cur.item); const ta = document.querySelector(".copybox"); if (ta) { ta.focus(); ta.select(); } $("dr-note").textContent = "请手动复制上面的文字。"; }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && cur) closeExplain(); });

// ---- controls ----
for (const b of document.querySelectorAll("[data-tab]")) b.addEventListener("click", () => {
  state.tab = b.dataset.tab; state.revealed.clear(); sticky.clear();
  if ((state.tab === "sentences" || state.tab === "stories") && state.cover === "zh") state.cover = "en";
  savePrefs(); render(); window.scrollTo({ top: 0 });
});
for (const b of document.querySelectorAll("[data-cover]")) b.addEventListener("click", () => { state.cover = b.dataset.cover; state.revealed.clear(); sticky.clear(); savePrefs(); render(); });
for (const b of document.querySelectorAll("[data-filter]")) b.addEventListener("click", () => { state.filter = b.dataset.filter; sticky.clear(); savePrefs(); render(); });
$("typing").addEventListener("click", () => {
  state.typing = !state.typing; sticky.clear();
  if (state.typing && state.cover !== "en") { state.cover = "en"; state.revealed.clear(); }
  savePrefs(); render();
  if (state.typing) { const first = document.querySelector(".type-in"); if (first) first.focus(); }
});
for (const b of document.querySelectorAll("[data-speed]")) b.addEventListener("click", () => { state.speed = Number(b.dataset.speed); savePrefs(); render(); });
if (!canSpeak) $("speed-ctl").hidden = true;
$("shuffle").addEventListener("click", () => { state.shuffle = !state.shuffle; order = {}; savePrefs(); render(); });

function rebuildReset() {
  const wrap = $("reset-wrap");
  const b = el("button", "tool danger", "清除本页标记");
  b.id = "reset";
  b.addEventListener("click", () => {
    const box = el("span", "confirm");
    const yes = el("button", "tool danger", "确认清除");
    const no = el("button", "tool", "取消");
    box.append("清除当前这一页的所有标记？", yes, no);
    wrap.replaceChildren(box);
    no.addEventListener("click", rebuildReset);
    yes.addEventListener("click", () => { for (const i of ITEMS[state.tab]) delete state.marks[i.id]; persist(); rebuildReset(); render(); });
  });
  wrap.replaceChildren(b);
}
rebuildReset();

function setMark(id, v) {
  if (v) state.marks[id] = v; else delete state.marks[id];
  persist(); render();
}

// ---- persistence: account storage when available, browser storage otherwise ----
let remote = null, writing = Promise.resolve(), timer = null, remoteFailed = false;
function persist() {
  writeLocal(marksKey, state.marks);
  if (!remote || remoteFailed) return;
  clearTimeout(timer);
  timer = setTimeout(() => {
    const body = { marks: { ...state.marks }, updatedAt: Date.now() };
    writing = writing.then(() => remote.set(body)).then(
      () => { $("sync").textContent = "标记已保存到你的账号"; },
      (e) => { if (e && e.code === "invalid_argument") { remoteFailed = true; } $("sync").textContent = "标记暂存在本浏览器"; }
    );
  }, 600);
}

async function initRemote() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db; userId = uid;
    remote = db.doc("data/users/" + uid + "/progress");
    const snap = await remote.get();
    if (snap.exists) {
      const saved = snap.data().marks || {};
      const merged = { ...state.marks, ...saved };
      state.marks = merged;
      writeLocal(marksKey, state.marks);
      render();
      if (JSON.stringify(merged) !== JSON.stringify(saved)) persist();
    } else if (Object.keys(state.marks).length) {
      persist();
    }
    $("sync").textContent = "标记已保存到你的账号";
    remote.onSnapshot((s) => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      const saved = s.data().marks || {};
      if (JSON.stringify(saved) !== JSON.stringify(state.marks)) { state.marks = { ...saved }; writeLocal(marksKey, state.marks); render(); }
    }, () => {});
  } catch (e) {
    remote = null;
  }
}

render();
initRemote();
window.addEventListener("resize", () => document.querySelectorAll(".type-in").forEach(fitBox));
(async () => { try { sampleFn = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch { sampleFn = null; } })();
</script>
