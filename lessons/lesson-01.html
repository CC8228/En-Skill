<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* Layout: sticky control bar (mode · filter · progress), then grouped card grids; cards stack to one column on phones. */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6877;
    --line: #dde2ea;
    --accent: #1f4fa3;
    --accent-soft: #e6edf9;
    --known: #1d7a4c;
    --known-soft: #e5f4ec;
    --unknown: #c2352b;
    --unknown-soft: #fcebea;
    --cover: #c9d1dd;
    --font-en: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161d; --surface: #19202a; --ink: #e8edf4; --muted: #9aa6b6; --line: #2a3442;
      --accent: #7ea6f0; --accent-soft: #1d2a40; --known: #5cc690; --known-soft: #16302a;
      --unknown: #f0786d; --unknown-soft: #3a1d1d; --cover: #3a4555; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161d; --surface: #19202a; --ink: #e8edf4; --muted: #9aa6b6; --line: #2a3442;
    --accent: #7ea6f0; --accent-soft: #1d2a40; --known: #5cc690; --known-soft: #16302a;
    --unknown: #f0786d; --unknown-soft: #3a1d1d; --cover: #3a4555; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-en), var(--font-zh); font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

  header.top { padding-block: 20px 8px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  header.top h1 { margin: 0; font-family: var(--font-zh); font-size: 22px; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
  header.top p { margin: 0; color: var(--muted); font-size: 13px; font-family: var(--font-zh); }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .tabs, .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button, .seg button {
    font: 600 13px/1 var(--font-zh); color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 8px 11px; cursor: pointer; white-space: nowrap;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .label { font: 500 12px/1 var(--font-zh); color: var(--muted); letter-spacing: 0.04em; }
  .ctl { display: inline-flex; align-items: center; gap: 6px; }
  .stats { margin-left: auto; display: inline-flex; gap: 12px; font: 500 13px/1 var(--font-num); font-variant-numeric: tabular-nums; }
  .stats .k { color: var(--known); } .stats .u { color: var(--unknown); } .stats .n { color: var(--muted); }
  .meter { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: flex; }
  .meter i { display: block; height: 100%; }
  .meter .mk { background: var(--known); } .meter .mu { background: var(--unknown); }
  .tool { font: 500 13px/1 var(--font-zh); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; cursor: pointer; }
  .tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .tool.danger { color: var(--unknown); }
  .sync { font: 12px/1 var(--font-zh); color: var(--muted); }
  .confirm { display: inline-flex; gap: 6px; align-items: center; font: 13px/1 var(--font-zh); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 500 12.5px/1 var(--font-zh); border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  section.group { margin-top: 22px; }
  section.group h2 { margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; font: 700 15px/1.2 var(--font-zh); }
  section.group h2 small { font: 400 12px/1 var(--font-en); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  section.group h2 .cnt { margin-left: auto; font: 500 12px/1 var(--font-num); color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  @media (max-width: 480px) { .grid, .grid.wide { grid-template-columns: 1fr; } }

  .card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: 6px; padding: 9px 10px 9px 11px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; min-width: 0;
  }
  .card.known { border-left-color: var(--known); }
  .card.unknown { border-left-color: var(--unknown); background: var(--unknown-soft); }
  .face { min-width: 0; cursor: pointer; display: grid; gap: 3px; border-radius: 4px; }
  .face:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .en { font: 600 15px/1.35 var(--font-en); overflow-wrap: anywhere; }
  .zh { font: 400 14px/1.45 var(--font-zh); color: var(--muted); overflow-wrap: anywhere; }
  .sent .zh { color: var(--ink); font-size: 15px; }
  .sent .en { font-weight: 400; font-size: 14.5px; color: var(--muted); }
  .num { font: 500 11px/1 var(--font-num); color: var(--muted); margin-right: 6px; }
  .covered { color: transparent !important; background: repeating-linear-gradient(135deg, var(--cover) 0 6px, transparent 6px 10px); border-radius: 3px; user-select: none; }
  .covered .num { color: transparent; }
  .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; }
  .say { grid-column: 1 / -1; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: 600 12px/1 var(--font-zh); border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .say svg { width: 14px; height: 14px; fill: currentColor; }
  .say.playing { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mk-btn { font: 600 12px/1 var(--font-zh); border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 6px; padding: 7px 8px; cursor: pointer; min-width: 40px; }
  .mk-btn.k[aria-pressed="true"] { background: var(--known); border-color: var(--known); color: #fff; }
  .mk-btn.u[aria-pressed="true"] { background: var(--unknown); border-color: var(--unknown); color: #fff; }
  .card.unknown .mk-btn { background: var(--surface); }
  .card.unknown .mk-btn.u[aria-pressed="true"] { background: var(--unknown); }

  .typer { grid-column: 1 / -1; display: grid; gap: 5px; margin-top: 2px; }
  .type-in { width: 100%; min-width: 0; font: 500 15px/1.3 var(--font-en); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .type-in::placeholder { color: var(--muted); font-family: var(--font-zh); font-size: 13px; }
  .type-in:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .type-in.ok { border-color: var(--known); background: var(--known-soft); }
  .type-in.bad { border-color: var(--unknown); background: var(--surface); }
  .verdict { font: 13px/1.5 var(--font-zh); overflow-wrap: anywhere; }
  .verdict.ok { color: var(--known); font-weight: 600; }
  .verdict.bad { color: var(--ink); }
  .verdict .tag { color: var(--unknown); font-weight: 600; margin-right: 6px; }
  .verdict .ans { font-family: var(--font-en); }
  .verdict .miss { color: var(--unknown); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .tally { font: 500 13px/1 var(--font-num); color: var(--accent); font-variant-numeric: tabular-nums; }
  .empty { margin-top: 28px; padding: 22px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-family: var(--font-zh); text-align: center; }
  .hint { margin-top: 10px; color: var(--muted); font: 13px/1.5 var(--font-zh); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { .stats { margin-left: 0; } }
  @media (prefers-reduced-motion: no-preference) { .card { transition: background .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>职场英语 · 第 1 课</h1>
    <p>项目协调与现场售后 · 60 个职业词组 · 88 个行业词汇 · 24 句中译英</p>
  </header>

  <div class="bar" id="bar">
    <div class="row">
      <div class="tabs" role="group" aria-label="内容">
        <button id="tab-phrases" data-tab="phrases" aria-pressed="true">职业词组</button>
        <button id="tab-industry" data-tab="industry" aria-pressed="false">行业词汇</button>
        <button id="tab-sentences" data-tab="sentences" aria-pressed="false">中译英</button>
      </div>
      <div class="stats" aria-live="polite"><span class="k" id="st-k">会 0</span><span class="u" id="st-u">不会 0</span><span class="n" id="st-n">未标 0</span></div>
    </div>
    <div class="meter" aria-hidden="true"><i class="mk" id="m-k"></i><i class="mu" id="m-u"></i></div>
    <div class="row">
      <span class="ctl"><span class="label">遮盖</span>
        <span class="seg" role="group" aria-label="遮盖">
          <button id="cov-none" data-cover="none" aria-pressed="false">不遮</button>
          <button id="cov-en" data-cover="en" aria-pressed="true">遮英文</button>
          <button id="cov-zh" data-cover="zh" aria-pressed="false">遮中文</button>
        </span>
      </span>
      <span class="ctl"><span class="label">显示</span>
        <span class="seg" role="group" aria-label="显示">
          <button id="flt-all" data-filter="all" aria-pressed="true">全部</button>
          <button id="flt-review" data-filter="review" aria-pressed="false">待复习</button>
          <button id="flt-unknown" data-filter="unknown" aria-pressed="false">只看不会</button>
        </span>
      </span>
      <span class="ctl" id="speed-ctl"><span class="label">发音</span>
        <span class="seg" role="group" aria-label="语速">
          <button id="spd-normal" data-speed="0.95" aria-pressed="true">正常</button>
          <button id="spd-slow" data-speed="0.7" aria-pressed="false">慢速</button>
        </span>
      </span>
      <button class="tool" id="typing" aria-pressed="true">打字练习</button>
      <span class="tally" id="tally" hidden></span>
      <button class="tool" id="shuffle" aria-pressed="false">打乱顺序</button>
      <span id="reset-wrap"><button class="tool danger" id="reset">清除本页标记</button></span>
      <span class="sync" id="sync">标记保存在本浏览器</span>
    </div>
    <div class="chips" id="chips" hidden></div>
  </div>

  <p class="hint" id="hint">点卡片显示被遮住的部分，再点一次重新遮住。按“会 / 不会”标记；“待复习”= 不会 + 还没标的。<b>打字练习</b>：选“遮英文”后，在卡片下的输入框里打英文，<b>回车</b>检查（对了自动标“会”，错了自动标“不会”并显示答案），<b>Tab</b> 跳到下一个，Shift+Tab 回上一个；手机上检查后再按一次回车也会跳到下一个。</p>
  <main id="list"></main>
</div>

// ---- items ----
const ITEMS = { phrases: [], industry: [], sentences: [] };
let n = 0;
DATA.phrases.forEach((g) => g.items.forEach(([en, zh]) => { n++; ITEMS.phrases.push({ id: "p" + n, n, en, zh, group: g.name, groupEn: g.en }); }));
DATA.industry.forEach((g, gi) => g.items.forEach(([en, zh], i) => ITEMS.industry.push({ id: "i" + gi + "-" + i, n: i + 1, en, zh, group: g.name })));
DATA.sentences.forEach(([zh, en], i) => ITEMS.sentences.push({ id: "s" + (i + 1), n: i + 1, en, zh, group: "中译英" }));
const INDUSTRIES = DATA.industry.map((g) => g.name);

// ---- state ----
const prefsKey = "lesson1-prefs", marksKey = "lesson1-marks";
const state = { tab: "phrases", cover: "en", filter: "all", shuffle: false, industries: [], speed: 0.95, typing: true, marks: {}, revealed: new Set() };
const typed = {};          // id -> { value, result: "ok" | "bad" | null }
const sticky = new Set();  // items answered this round stay on screen even if the filter would hide them
function readLocal(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } }
function writeLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
Object.assign(state, readLocal(prefsKey) || {});
state.revealed = new Set();
state.marks = readLocal(marksKey) || {};
let order = {};

function savePrefs() { const { tab, cover, filter, shuffle, industries, speed, typing } = state; writeLocal(prefsKey, { tab, cover, filter, shuffle, industries, speed, typing }); }

// ---- rendering ----
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function visible(item) {
  if (sticky.has(item.id)) return true;
  const m = state.marks[item.id];
  if (state.filter === "review") return m !== "k";
  if (state.filter === "unknown") return m === "u";
  return true;
}
function shuffled(list, key) {
  if (!state.shuffle) return list;
  if (!order[key]) { order[key] = list.map((x) => x.id).sort(() => Math.random() - 0.5); }
  const pos = new Map(order[key].map((id, i) => [id, i]));
  return [...list].sort((a, b) => pos.get(a.id) - pos.get(b.id));
}

// ---- typing practice ----
function norm(t) {
  return t.toLowerCase()
    .replace(/[‘’ʼ`]/g, "'")
    .replace(/won't/g, "will not").replace(/can't|cannot/g, "can not").replace(/n't\b/g, " not")
    .replace(/\bcant\b/g, "can not").replace(/\b(do|does|did|is|are|was|were|have|has|had|could|should|would)nt\b/g, "$1 not").replace(/'ll\b/g, " will").replace(/'re\b/g, " are").replace(/'ve\b/g, " have").replace(/'m\b/g, " am").replace(/'d\b/g, " would")
    .replace(/[-–—_/]/g, " ")
    .replace(/[^a-z0-9' ]+/g, " ")
    .replace(/\s+/g, " ").trim();
}
function answers(en) {
  let forms = [en];
  if (en.includes(" / ")) forms = forms.concat(en.split(" / "));
  const out = new Set();
  for (const f of forms) {
    for (const sb of ["sb.", "somebody", "someone"]) for (const sth of ["sth.", "something"]) {
      out.add(norm(f.replace(/\bsb\./g, sb).replace(/\bsth\./g, sth)));
    }
  }
  return out;
}
function isCorrect(value, item) { return answers(item.en).has(norm(value)); }
// Words of the reference answer that the typed answer did not match (longest common subsequence on words).
function same(ref, w) {
  return ref === w || (ref === "sb" && (w === "somebody" || w === "someone")) || (ref === "sth" && w === "something");
}
function missedWords(value, en) {
  const words = en.split(/\s+/);
  const parts = [];  // [wordIndex, normalizedPart]
  words.forEach((w, wi) => norm(w).split(" ").filter(Boolean).forEach((p) => parts.push([wi, p])));
  const a = norm(value).split(" ").filter(Boolean);
  const L = Array.from({ length: parts.length + 1 }, () => new Array(a.length + 1).fill(0));
  for (let i = parts.length - 1; i >= 0; i--) for (let j = a.length - 1; j >= 0; j--)
    L[i][j] = same(parts[i][1], a[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const hit = new Array(parts.length).fill(false);
  for (let i = 0, j = 0; i < parts.length && j < a.length;) {
    if (same(parts[i][1], a[j])) { hit[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  const ok = words.map(() => true);
  parts.forEach(([wi], k) => { if (!hit[k]) ok[wi] = false; });
  return words.map((w, i) => [w, ok[i]]);
}
function typingOn() { return state.typing && state.cover === "en"; }
function focusInput(id) {
  const inp = document.querySelector('input.type-in[data-id="' + id + '"]');
  if (inp) { inp.focus({ preventScroll: true }); inp.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  return !!inp;
}
function moveFocus(fromId, dir) {
  const all = [...document.querySelectorAll("input.type-in")];
  const i = all.findIndex((x) => x.dataset.id === fromId);
  const next = all[i + dir];
  if (next) { next.focus({ preventScroll: true }); next.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function checkTyped(item, value) {
  const ok = isCorrect(value, item);
  typed[item.id] = { value, result: ok ? "ok" : "bad" };
  sticky.add(item.id);
  state.revealed.add(item.id);
  setMark(item.id, ok ? "k" : "u");
}
function typer(item) {
  const box = el("div", "typer");
  const t = typed[item.id] || { value: "", result: null };
  const inp = el("input", "type-in" + (t.result ? " " + t.result : ""));
  inp.type = "text"; inp.id = "type-" + item.id; inp.dataset.id = item.id; inp.value = t.value;
  inp.placeholder = "输入英文，回车检查";
  inp.setAttribute("aria-label", "输入英文：" + item.zh);
  for (const [k, v] of [["autocomplete", "off"], ["autocapitalize", "off"], ["autocorrect", "off"], ["spellcheck", "false"], ["lang", "en"], ["enterkeyhint", "next"]]) inp.setAttribute(k, v);
  inp.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.key === "Enter") {
      e.preventDefault();
      const cur = typed[item.id];
      if (cur && cur.result && cur.value === inp.value) moveFocus(item.id, 1);
      else checkTyped(item, inp.value);
    } else if (e.key === "Tab") {
      e.preventDefault();
      moveFocus(item.id, e.shiftKey ? -1 : 1);
    }
  });
  inp.addEventListener("input", () => {
    typed[item.id] = { value: inp.value, result: null };
    inp.classList.remove("ok", "bad");
    const v = box.querySelector(".verdict"); if (v) v.remove();
  });
  box.append(inp);
  if (t.result === "ok") box.append(el("div", "verdict ok", "✓ 正确"));
  if (t.result === "bad") {
    const v = el("div", "verdict bad");
    v.append(el("span", "tag", t.value.trim() ? "✗ 不对" : "✗ 没填"));
    v.append("正确答案：");
    const ans = el("span", "ans");
    missedWords(t.value, item.en).forEach(([w, okw], i) => { if (i) ans.append(" "); ans.append(okw ? document.createTextNode(w) : el("span", "miss", w)); });
    v.append(ans);
    box.append(v);
  }
  return box;
}

function card(item, sentence) {
  const m = state.marks[item.id];
  const c = el("div", "card" + (sentence ? " sent" : "") + (m === "k" ? " known" : m === "u" ? " unknown" : ""));
  const face = el("div", "face");
  face.tabIndex = 0;
  face.setAttribute("role", "button");
  const shown = state.revealed.has(item.id);
  const first = sentence ? ["zh", item.zh] : ["en", item.en];
  const second = sentence ? ["en", item.en] : ["zh", item.zh];
  for (const [kind, text] of [first, second]) {
    const line = el("div", kind);
    if (kind === first[0]) { line.append(el("span", "num", String(item.n))); }
    line.append(document.createTextNode(text));
    if (state.cover === kind && !shown) line.classList.add("covered");
    face.append(line);
  }
  face.setAttribute("aria-label", state.cover === "none" ? "卡片" : (shown ? "点击重新遮住" : "点击显示"));
  const toggle = () => { if (state.cover === "none") return; shown ? state.revealed.delete(item.id) : state.revealed.add(item.id); render(); };
  face.addEventListener("click", toggle);
  face.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  const marks = el("div", "marks");
  for (const [v, label] of [["k", "会"], ["u", "不会"]]) {
    const b = el("button", "mk-btn " + v, label);
    b.setAttribute("aria-pressed", String(m === v));
    b.addEventListener("click", () => setMark(item.id, m === v ? null : v));
    marks.append(b);
  }
  if (canSpeak) {
    const say = el("button", "say");
    say.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
    say.append(document.createTextNode("发音"));
    say.setAttribute("aria-label", "播放发音：" + item.en);
    say.addEventListener("click", () => speak(item.en, say));
    marks.append(say);
  }
  c.append(face, marks);
  if (typingOn()) c.append(typer(item));
  return c;
}

function render() {
  const act = document.activeElement;
  const focusId = act && act.classList && act.classList.contains("type-in") ? act.dataset.id : null;
  const caret = focusId ? act.selectionStart : null;
  renderView();
  if (focusId) {
    const inp = document.querySelector('input.type-in[data-id="' + focusId + '"]');
    if (inp) { inp.focus({ preventScroll: true }); try { inp.setSelectionRange(caret, caret); } catch {} }
  }
}
function renderView() {
  const tab = state.tab;
  for (const b of document.querySelectorAll("[data-tab]")) b.setAttribute("aria-pressed", String(b.dataset.tab === tab));
  for (const b of document.querySelectorAll("[data-cover]")) b.setAttribute("aria-pressed", String(b.dataset.cover === state.cover));
  for (const b of document.querySelectorAll("[data-filter]")) b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter));
  $("shuffle").setAttribute("aria-pressed", String(state.shuffle));
  $("typing").setAttribute("aria-pressed", String(state.typing));
  const tl = $("tally"); tl.hidden = !typingOn();
  if (typingOn()) {
    const ids = new Set(ITEMS[tab].map((i) => i.id));
    const res = Object.entries(typed).filter(([id, t]) => ids.has(id) && t.result);
    tl.textContent = "本轮打字 对 " + res.filter(([, t]) => t.result === "ok").length + " / " + res.length;
  }
  for (const b of document.querySelectorAll("[data-speed]")) b.setAttribute("aria-pressed", String(Number(b.dataset.speed) === (state.speed || 0.95)));

  // industry chips
  const chips = $("chips");
  chips.hidden = tab !== "industry";
  if (tab === "industry") {
    chips.replaceChildren();
    const all = el("button", "chip", "全部行业");
    all.setAttribute("aria-pressed", String(state.industries.length === 0));
    all.addEventListener("click", () => { state.industries = []; savePrefs(); render(); });
    chips.append(all);
    for (const name of INDUSTRIES) {
      const b = el("button", "chip", name);
      const on = state.industries.includes(name);
      b.setAttribute("aria-pressed", String(on));
      b.addEventListener("click", () => {
        state.industries = on ? state.industries.filter((x) => x !== name) : [...state.industries, name];
        savePrefs(); render();
      });
      chips.append(b);
    }
  }

  let pool = ITEMS[tab];
  if (tab === "industry" && state.industries.length) pool = pool.filter((i) => state.industries.includes(i.group));

  // stats for the current pool (before the display filter)
  const k = pool.filter((i) => state.marks[i.id] === "k").length;
  const u = pool.filter((i) => state.marks[i.id] === "u").length;
  $("st-k").textContent = "会 " + k; $("st-u").textContent = "不会 " + u; $("st-n").textContent = "未标 " + (pool.length - k - u);
  $("m-k").style.width = (pool.length ? (k / pool.length) * 100 : 0) + "%";
  $("m-u").style.width = (pool.length ? (u / pool.length) * 100 : 0) + "%";

  const list = $("list");
  list.replaceChildren();
  const shown = pool.filter(visible);
  if (!shown.length) {
    const msg = state.filter === "unknown" ? "这一页没有标成“不会”的条目。" : "这一页的条目都已经标成“会”了。切到“全部”可以重新看。";
    list.append(el("div", "empty", msg));
    return;
  }
  if (state.shuffle) {
    const sec = el("section", "group");
    const h = el("h2", null, "打乱顺序"); h.append(el("span", "cnt", shown.length + " 条"));
    const grid = el("div", "grid" + (tab === "sentences" ? " wide" : ""));
    shuffled(shown, tab + state.industries.join()).forEach((i) => grid.append(card(i, tab === "sentences")));
    sec.append(h, grid); list.append(sec);
    return;
  }
  const groups = [...new Set(shown.map((i) => i.group))];
  for (const g of groups) {
    const items = shown.filter((i) => i.group === g);
    const sec = el("section", "group");
    const h = el("h2", null, g);
    if (items[0].groupEn) h.append(el("small", null, items[0].groupEn));
    h.append(el("span", "cnt", items.length + " 条"));
    const grid = el("div", "grid" + (tab === "sentences" ? " wide" : ""));
    items.forEach((i) => grid.append(card(i, tab === "sentences")));
    sec.append(h, grid); list.append(sec);
  }
}

// ---- pronunciation (the browser's built-in English voice) ----
const synth = window.speechSynthesis;
const canSpeak = !!(synth && window.SpeechSynthesisUtterance);
let voice = null;
function pickVoice() {
  if (!canSpeak) return;
  const vs = synth.getVoices().filter((v) => /^en[-_]/i.test(v.lang));
  const rank = (v) => (/en[-_]US/i.test(v.lang) ? 0 : /en[-_]GB/i.test(v.lang) ? 1 : 2) * 10
    + (/(natural|neural|google|samantha|aria|jenny|ava|alex)/i.test(v.name) ? 0 : 5) + (v.localService ? 0 : 1);
  voice = vs.sort((a, b) => rank(a) - rank(b))[0] || null;
}
if (canSpeak) { pickVoice(); synth.addEventListener?.("voiceschanged", pickVoice); }
function spoken(text) {
  return text.replace(/\bsb\./g, "somebody").replace(/\bsth\./g, "something").replace(/\s\/\s/g, ", or ");
}
let playingBtn = null;
function speak(text, btn) {
  if (!canSpeak) return;
  synth.cancel();
  if (playingBtn) playingBtn.classList.remove("playing");
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.lang = voice ? voice.lang : "en-US";
  if (voice) u.voice = voice;
  u.rate = state.speed || 0.95;
  playingBtn = btn; btn.classList.add("playing");
  const done = () => { btn.classList.remove("playing"); if (playingBtn === btn) playingBtn = null; };
  u.onend = done; u.onerror = done;
  synth.speak(u);
}

// ---- controls ----
for (const b of document.querySelectorAll("[data-tab]")) b.addEventListener("click", () => {
  state.tab = b.dataset.tab; state.revealed.clear(); sticky.clear();
  if (state.tab === "sentences" && state.cover === "zh") state.cover = "en";
  savePrefs(); render(); window.scrollTo({ top: 0 });
});
for (const b of document.querySelectorAll("[data-cover]")) b.addEventListener("click", () => { state.cover = b.dataset.cover; state.revealed.clear(); sticky.clear(); savePrefs(); render(); });
for (const b of document.querySelectorAll("[data-filter]")) b.addEventListener("click", () => { state.filter = b.dataset.filter; sticky.clear(); savePrefs(); render(); });
$("typing").addEventListener("click", () => {
  state.typing = !state.typing; sticky.clear();
  if (state.typing && state.cover !== "en") { state.cover = "en"; state.revealed.clear(); }
  savePrefs(); render();
  if (state.typing) { const first = document.querySelector("input.type-in"); if (first) first.focus(); }
});
for (const b of document.querySelectorAll("[data-speed]")) b.addEventListener("click", () => { state.speed = Number(b.dataset.speed); savePrefs(); render(); });
if (!canSpeak) $("speed-ctl").hidden = true;
$("shuffle").addEventListener("click", () => { state.shuffle = !state.shuffle; order = {}; savePrefs(); render(); });

function rebuildReset() {
  const wrap = $("reset-wrap");
  const b = el("button", "tool danger", "清除本页标记");
  b.id = "reset";
  b.addEventListener("click", () => {
    const box = el("span", "confirm");
    const yes = el("button", "tool danger", "确认清除");
    const no = el("button", "tool", "取消");
    box.append("清除当前这一页的所有标记？", yes, no);
    wrap.replaceChildren(box);
    no.addEventListener("click", rebuildReset);
    yes.addEventListener("click", () => { for (const i of ITEMS[state.tab]) delete state.marks[i.id]; persist(); rebuildReset(); render(); });
  });
  wrap.replaceChildren(b);
}
rebuildReset();

function setMark(id, v) {
  if (v) state.marks[id] = v; else delete state.marks[id];
  persist(); render();
}

// ---- persistence: account storage when available, browser storage otherwise ----
let remote = null, writing = Promise.resolve(), timer = null, remoteFailed = false;
function persist() {
  writeLocal(marksKey, state.marks);
  if (!remote || remoteFailed) return;
  clearTimeout(timer);
  timer = setTimeout(() => {
    const body = { marks: { ...state.marks }, updatedAt: Date.now() };
    writing = writing.then(() => remote.set(body)).then(
      () => { $("sync").textContent = "标记已保存到你的账号"; },
      (e) => { if (e && e.code === "invalid_argument") { remoteFailed = true; } $("sync").textContent = "标记暂存在本浏览器"; }
    );
  }, 600);
}

async function initRemote() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    remote = db.doc("data/users/" + uid + "/progress");
    const snap = await remote.get();
    if (snap.exists) {
      const saved = snap.data().marks || {};
      const merged = { ...state.marks, ...saved };
      state.marks = merged;
      writeLocal(marksKey, state.marks);
      render();
      if (JSON.stringify(merged) !== JSON.stringify(saved)) persist();
    } else if (Object.keys(state.marks).length) {
      persist();
    }
    $("sync").textContent = "标记已保存到你的账号";
    remote.onSnapshot((s) => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      const saved = s.data().marks || {};
      if (JSON.stringify(saved) !== JSON.stringify(state.marks)) { state.marks = { ...saved }; writeLocal(marksKey, state.marks); render(); }
    }, () => {});
  } catch (e) {
    remote = null;
  }
}

render();
initRemote();
</script>
